[plugin]
id = "pomodoro"
name = "Pomodoro"
version = "0.1.1"
api = 1
description = "Focus in sessions with breaks between them: a ring that fills as the time goes, the sessions of each set, what you're working on, Do Not Disturb while you focus, and today's and the week's focus at a glance"
requires = ["shell-bar", "hypr-base"]
categories = ["panel", "bar", "tools"]

[settings]
# Opens the Pomodoro panel.
key = "SUPER + ALT + P"
# The timer in the bar (a small ring and the time left while it runs).
bar = true
# Minutes of a focus session.
focus_minutes = { default = 25, min = 1, max = 180 }
# Minutes of a short break.
short_break = { default = 5, min = 1, max = 60 }
# Minutes of a long break.
long_break = { default = 15, min = 1, max = 90 }
# Focus sessions before a long break.
sessions_before_long = { default = 4, min = 1, max = 12 }
# A break starts by itself when a focus session ends.
auto_start_breaks = true
# The next focus session starts by itself when a break ends (else it waits for you).
auto_start_focus = false
# Focus sessions a day you aim for.
daily_goal = { default = 8, min = 1, max = 24 }
# Do Not Disturb while a focus session runs (the timer's own notices still come).
do_not_disturb = true
# A sound when a phase ends.
sound = true

# The settings, read live by the timer: changing one doesn't reload the
# shell (no reload command), the timer follows the file.
[[targets]]
template = "settings.json.tmpl"
output = "~/.config/quickshell/mazapan/components/pomodoro/settings.json"

# The timer, its ring, kept for the whole shell.
[[targets]]
template = "qmldir.tmpl"
output = "~/.config/quickshell/mazapan/components/pomodoro/qmldir"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "PomodoroService.qml.tmpl"
output = "~/.config/quickshell/mazapan/components/pomodoro/PomodoroService.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "Ring.qml.tmpl"
output = "~/.config/quickshell/mazapan/components/pomodoro/Ring.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "Bar.qml.tmpl"
output = "~/.config/quickshell/mazapan/widgets/right/03-pomodoro.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "Section.qml.tmpl"
output = "~/.config/quickshell/mazapan/control/sections/35-pomodoro-session.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "Pomodoro.qml.tmpl"
output = "~/.config/quickshell/mazapan/panels/pomodoro.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "pomodoro.lua.tmpl"
output = "~/.config/hypr/mazapan/pomodoro.lua"
reload = "hyprctl reload >/dev/null"

[[actions]]
name = "{{ t \"act.open\" }}"
run = "qs ipc -c mazapan call mazapan panel pomodoro"
# On the palette's first screen, among the places.
home = 30
glyph = "󰔛"
label = "{{ t \"home\" }}"
key = "{{ settings.key }}"
keywords = "{{ t \"act.open.kw\" }}"

[[actions]]
name = "{{ t \"act.toggle\" }}"
run = "qs ipc -c mazapan call pomodoro toggle"
keywords = "{{ t \"act.toggle.kw\" }}"

[[actions]]
name = "{{ t \"act.skip\" }}"
run = "qs ipc -c mazapan call pomodoro skip"
keywords = "{{ t \"act.skip.kw\" }}"

[[actions]]
name = "{{ t \"act.reset\" }}"
run = "qs ipc -c mazapan call pomodoro reset"
keywords = "{{ t \"act.reset.kw\" }}"
