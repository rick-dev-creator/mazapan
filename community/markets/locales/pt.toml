"setting.stock_source.help" = "De onde vêm os preços das ações: \"yahoo\" não precisa de conta (a API não oficial do Yahoo Finance: pode mudar); \"twelvedata\" precisa de uma chave gratuita de twelvedata.com."
"setting.twelvedata_key" = "Chave do Twelve Data"
"setting.twelvedata_key.help" = "Sua chave do Twelve Data, para stock_source = \"twelvedata\". Ela fica em config.toml e no QML gerado do painel, em texto puro, como qualquer configuração; o plano gratuito aceita 8 requisições por minuto, então as ações são atualizadas uma a cada 8 segundos."
"setting.hide_stablecoins" = "Ocultar stablecoins"
"setting.hide_stablecoins.help" = "Deixa de fora das 20 maiores as stablecoins e as cópias embrulhadas ou em staking de outras moedas (USDT, WBTC, stETH…)."
