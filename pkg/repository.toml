# Where Mazapan's own packages are published (pkg/release makes them,
# pkg/publish-repo puts them there: GitHub Pages of
# rick-dev-creator/mazapan-repo). $channel is stable or edge, $arch is
# pacman's own. A package built with MAZAPAN_REPO_SERVER set says that
# instead (tests in the VMs).
server = "https://repo.mazapan.dev/$channel/$arch"
