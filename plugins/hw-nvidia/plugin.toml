[plugin]
id = "hw-nvidia"
name = "NVIDIA (Turing and newer)"
version = "0.2.0"
api = 1
description = "NVIDIA's open driver for GeForce RTX 20 and newer: packages, kernel modesetting loaded early, and Hyprland's variables for it"
categories = ["hardware"]
requires = ["hypr-base"]

[hardware]
# Turing (TU1xx) and newer run NVIDIA's open kernel modules (they have a GSP).
gpu = ["NVIDIA*TU1*", "NVIDIA*GA1*", "NVIDIA*AD1*", "NVIDIA*GB2*", "NVIDIA*GH1*"]

[packages]
pacman = ["nvidia-open-dkms", "nvidia-utils", "libva-nvidia-driver", "linux-headers", "nvidia-prime"]

[[targets]]
template = "modprobe.conf.tmpl"
output = "/etc/modprobe.d/mazapan-nvidia.conf"
system = true
reboot = true
# The initramfs carries modprobe.d too (the modconf hook). NVIDIA's sleep
# services save the card's memory as the system sleeps or hibernates.
reload = "for s in nvidia-suspend nvidia-hibernate nvidia-resume nvidia-suspend-then-hibernate; do [ -e /usr/lib/systemd/system/$s.service ] && systemctl enable $s.service; done; mkinitcpio -P"

[[targets]]
template = "mkinitcpio.conf.tmpl"
output = "/etc/mkinitcpio.conf.d/mazapan-nvidia.conf"
system = true
reboot = true
# With the screen on it, the initramfs carries the modules, so the driver
# starts before the screen does (hybrid laptops: not needed).
reload = "mkinitcpio -P"

[[targets]]
template = "nvidia.lua.tmpl"
output = "~/.config/hypr/mazapan/hw-nvidia.lua"

# The open modules are built for the running kernel on install (DKMS): its
# headers must be there first, or the driver never loads.
[[checks]]
name = "{{ t \"check.headers\" }}"
run = "for k in /usr/lib/modules/*/pkgbase; do [ -e \"${k%/pkgbase}/build\" ] || exit 1; done"
before_system = true
