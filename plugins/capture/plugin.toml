[plugin]
id = "capture"
name = "Capture"
version = "0.4.0"
api = 1
description = "One capture overlay: pick a region or a window on a frozen screen, then copy, save, copy its text (OCR), annotate or record it"
categories = ["tools"]
requires = ["shell-bar", "hypr-base"]

[packages]
# OCR in another language needs its data too: tesseract-data-spa, -fra…
pacman = ["grim", "wl-clipboard", "tesseract", "tesseract-data-eng", "wf-recorder", "zbar", "mpv"]

[settings]
# Opens the capture overlay; while recording, stops the recording.
key = "Print"
# Where screenshots and recordings go.
pictures = { default = "~/Pictures/Screenshots", kind = "path" }
# Where recordings go.
videos = { default = "~/Videos/Recordings", kind = "path" }
# Record the sound too (the default output).
audio = false

[[targets]]
template = "capture.lua.tmpl"
output = "~/.config/hypr/mazapan/capture.lua"
reload = "hyprctl reload >/dev/null"

[[targets]]
template = "Capture.qml.tmpl"
output = "~/.config/quickshell/mazapan/panels/capture.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

# The recording, in the bar while it lasts: click to stop.
[[targets]]
template = "Recording.qml.tmpl"
output = "~/.config/quickshell/mazapan/widgets/center/40-recording.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

# Its place in the Control Center (when that's on, the red dot leaves the
# bar: the status pill says it).
[[targets]]
template = "Now.qml.tmpl"
output = "~/.config/quickshell/mazapan/control/now/20-recording.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[actions]]
name = "{{ t \"act.capture\" }}"
run = "qs ipc -c mazapan call mazapan panel capture"
# On the palette's first screen.
home = 11
glyph = "󰄀"
label = "{{ t \"home\" }}"
key = "{{ settings.key }}"
keywords = "{{ t \"act.capture.kw\" }}"

[[actions]]
name = "{{ t \"act.stop\" }}"
run = "kill -INT \"$(cut -d' ' -f1 \"${XDG_RUNTIME_DIR}/mazapan-capture/recording\")\""
keywords = "{{ t \"act.stop.kw\" }}"
