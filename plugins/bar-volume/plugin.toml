[plugin]
id = "bar-volume"
name = "Volume"
version = "0.1.0"
api = 1
description = "Output volume in the bar: scroll to change, middle-click to mute, click for outputs and inputs"
requires = ["shell-bar"]

[packages]
pacman = ["quickshell", "pipewire", "wireplumber"]

[settings]
# Change per wheel notch, as a fraction (0.05 = 5%).
step = { default = 0.05, min = 0.01, max = 0.25, step = 0.01 }
# Highest volume the slider and the wheel reach: 1.0 = 100%; up to 1.5 to
# boost quiet sources (it can distort).
max_volume = { default = 1.0, min = 1.0, max = 1.5, step = 0.05 }
# Show the volume as a percentage next to the icon.
show_percent = true

[[targets]]
template = "Volume.qml.tmpl"
output = "~/.config/quickshell/myarch/widgets/right/30-volume.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"

# With a sound card, PipeWire runs and there is a default output. Without
# one there is nothing to check.
[[checks]]
name = "{{ t \"check\" }}"
run = "[ -z \"$(ls -d /proc/asound/card[0-9]* 2>/dev/null)\" ] || wpctl inspect @DEFAULT_AUDIO_SINK@ >/dev/null"
session = true
