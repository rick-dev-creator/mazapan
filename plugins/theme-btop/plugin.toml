[plugin]
id = "theme-btop"
name = "btop theme"
version = "0.1.0"
api = 1
description = "btop in the theme: its boxes, graphs and meters from the theme's colors, over the terminal's background"
categories = ["theme"]

[packages]
pacman = ["btop"]

[[targets]]
template = "mazapan.theme.tmpl"
output = "~/.config/btop/themes/mazapan.theme"

# btop writes its own settings here: only the theme's are mazapan's.
[[targets]]
template = "btop.conf.tmpl"
output = "~/.config/btop/btop.conf"
merge = "ini"

[coverage]
apps = ["btop"]
