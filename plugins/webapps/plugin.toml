[plugin]
id = "webapps"
name = "Web apps"
version = "0.1.0"
api = 1
description = "A site as an app of its own (WhatsApp, Gmail…): its own window and icon, in the palette and the launcher; opened again, its window comes forward"
categories = ["panel", "tools"]
requires = ["shell-bar", "hypr-base"]

[packages]
pacman = ["curl", "file", "jq", "libnotify", "xdg-utils", "qt6-imageformats"]

[[targets]]
template = "webapp.sh.tmpl"
output = "~/.local/share/mazapan/bin/webapp"

[[targets]]
template = "Webapps.qml.tmpl"
output = "~/.config/quickshell/mazapan/panels/webapps.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[actions]]
name = "{{ t \"act.open\" }}"
run = "qs ipc -c mazapan call mazapan panel webapps"
keywords = "{{ t \"act.open.kw\" }}"

[[checks]]
name = "{{ t \"check.browser\" }}"
run = "sh ~/.local/share/mazapan/bin/webapp browser >/dev/null"
