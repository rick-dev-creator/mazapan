[plugin]
id = "palette"
name = "Command palette"
version = "0.3.0"
api = 1
description = "One palette for apps, open windows, every plugin's actions and keybindings, each showing the command it runs"
categories = ["panel", "tools"]
requires = ["shell-bar", "hypr-base"]

[packages]
pacman = ["quickshell", "wl-clipboard", "foot"]

[settings]
# Opens the palette.
key = "SUPER + space"
# A button for it at the start of the bar (left of the workspaces).
bar = true
# Show the command behind every result, so you learn it as you go.
show_commands = true
# Terminal apps (btop…) open in this terminal; commands that ask or print
# (mazapan update) in terminal_hold, which stays open afterwards. Shell
# commands: quote as you would in a shell.
terminal = "foot"
# The terminal for commands that ask or print: it stays open afterwards, to read.
terminal_hold = { default = "foot --hold", kind = "command" }

[[targets]]
template = "palette.lua.tmpl"
output = "~/.config/hypr/mazapan/palette.lua"
reload = "hyprctl reload >/dev/null"

[[targets]]
template = "Widget.qml.tmpl"
output = "~/.config/quickshell/mazapan/widgets/left/05-palette.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "Palette.qml.tmpl"
output = "~/.config/quickshell/mazapan/panels/palette.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[actions]]
name = "{{ t \"act.palette\" }}"
key = "{{ settings.key }}"
keywords = "{{ t \"act.palette.kw\" }}"

[[actions]]
name = "{{ t \"act.update\" }}"
run = "mazapan update"
terminal = true
keywords = "{{ t \"act.update.kw\" }}"

[[actions]]
name = "{{ t \"act.doctor\" }}"
run = "mazapan doctor"
terminal = true
keywords = "{{ t \"act.doctor.kw\" }}"

[[actions]]
name = "{{ t \"act.history\" }}"
run = "mazapan history"
terminal = true
keywords = "{{ t \"act.history.kw\" }}"

[[actions]]
name = "{{ t \"act.rollback\" }}"
run = "mazapan rollback"
terminal = true
keywords = "{{ t \"act.rollback.kw\" }}"

[[actions]]
name = "{{ t \"act.apply\" }}"
run = "mazapan apply"
terminal = true
keywords = "{{ t \"act.apply.kw\" }}"
