[plugin]
id = "welcome"
name = "Welcome"
version = "0.1.0"
api = 1
description = "The first login's welcome: language, keyboard, time zone, Wi-Fi, the look and apps by profile, a screen each; again from the palette any time"
categories = ["panel", "tools"]
requires = ["shell-bar", "hypr-base", "apps", "themes"]

[packages]
pacman = ["quickshell", "curl", "networkmanager"]

[[targets]]
template = "Welcome.qml.tmpl"
output = "~/.config/quickshell/mazapan/panels/welcome.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[actions]]
name = "{{ t \"act.open\" }}"
run = "qs ipc -c mazapan call mazapan panel welcome"
keywords = "{{ t \"act.open.kw\" }}"
