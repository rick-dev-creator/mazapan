[plugin]
id = "bar-clock"
name = "Clock"
version = "0.1.0"
api = 1
description = "Day, date and time in the middle of the bar, in the system's language; click for a calendar"

[packages]
pacman = ["quickshell"]

[settings]
# Empty: day and date ("sáb 28 sept") plus the time as the language writes
# it (24h in Spanish, 12h in US English). Or a Qt date format of your own,
# e.g. "dddd d · HH:mm" (https://doc.qt.io/qt-6/qml-qtqml-qt.html#formatDateTime-method).
format = ""
font_size = 9.5

[[targets]]
template = "Clock.qml.tmpl"
output = "~/.config/quickshell/myarch/widgets/center/20-clock.qml"
# Ask the running shell to reload; start it if it isn't running.
reload = '''qs ipc -c myarch call myarch reload >/dev/null 2>&1 || { qs kill -c myarch >/dev/null 2>&1; hyprctl dispatch 'hl.dsp.exec_cmd("qs -c myarch")' >/dev/null; }'''
