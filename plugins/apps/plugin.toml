[plugin]
id = "apps"
name = "Apps"
version = "0.1.0"
api = 1
description = "Install apps by what you'll use the computer for (Development, Gaming, Creative…) or one by one, with one button: what it will do said first, no terminal, each undoable"
categories = ["panel", "tools"]
requires = ["shell-bar", "hypr-base", "polkit"]

[packages]
pacman = ["quickshell", "polkit", "xdg-terminal-exec"]

[settings]
# Opens the Apps menu.
key = "SUPER + ALT + A"
# Terminal apps (Neovim, btop…) open in this terminal; empty, the default
# one (Settings, Default apps).
terminal = { default = "", kind = "command" }

[[targets]]
template = "Apps.qml.tmpl"
output = "~/.config/quickshell/mazapan/panels/apps.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "apps.lua.tmpl"
output = "~/.config/hypr/mazapan/apps.lua"
reload = "hyprctl reload >/dev/null"

[[actions]]
name = "{{ t \"act.open\" }}"
run = "qs ipc -c mazapan call mazapan panel apps"
# On the palette's first screen.
home = 1
glyph = "󰀻"
key = "{{ settings.key }}"
keywords = "{{ t \"act.open.kw\" }}"
