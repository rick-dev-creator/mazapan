[plugin]
id = "bar-bluetooth"
name = "Bluetooth"
version = "0.1.0"
api = 1
description = "Bluetooth in the bar; click to connect, pair and forget devices"
categories = ["bar"]
requires = ["shell-bar"]

# Quickshell talks to BlueZ over D-Bus.
[packages]
pacman = ["quickshell", "bluez"]

[settings]
# Without a Bluetooth adapter there is nothing to do: hide the widget.
hide_without_adapter = true

[[targets]]
template = "Bluetooth.qml.tmpl"
output = "~/.config/quickshell/mazapan/widgets/right/20-bluetooth.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

# Its place in the Control Center (when that's on, the widget leaves the bar).
[[targets]]
template = "Tile.qml.tmpl"
output = "~/.config/quickshell/mazapan/control/tiles/20-bluetooth.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

# If you use Bluetooth (an adapter, and bluetooth.service enabled), BlueZ
# runs. No adapter, or a service you never enabled (Arch doesn't by
# default), is nothing to check.
[[checks]]
name = "{{ t \"check\" }}"
run = "[ -z \"$(ls /sys/class/bluetooth 2>/dev/null)\" ] || ! systemctl is-enabled -q bluetooth || systemctl is-active -q bluetooth"

[[actions]]
name = "{{ t \"act.bluetooth\" }}"
run = "rfkill toggle bluetooth"
glyph = "󰂯"
setting = true
keywords = "{{ t \"act.bluetooth.kw\" }}"
