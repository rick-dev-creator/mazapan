[plugin]
id = "hw-asus-um5606-psr"
name = "ASUS Zenbook S 16 screen that keeps updating"
version = "0.1.0"
api = 1
description = "The ASUS Zenbook S 16 (UM5606, AMD Ryzen AI) screen no longer freezes on its last frame, the mouse and keyboard seemingly dead: Panel Self Refresh, which its OLED panel hangs in, turned off"
categories = ["hardware"]

[hardware]
# The Zenbook S 16 (UM5606WA, UM5606KA, UM5606GA…), on its AMD graphics.
product = ["*UM5606*"]
gpu = ["Advanced Micro Devices*"]

# amdgpu starts from the initramfs, which carries modprobe.d too (the
# modconf hook): rebuilt, so it reads the option from the first frame.
[[targets]]
template = "amdgpu.conf.tmpl"
output = "/etc/modprobe.d/mazapan-asus-um5606-psr.conf"
system = true
reboot = true
reload = "mkinitcpio -P"

[[checks]]
name = "{{ t \"check.option\" }}"
# What amdgpu runs with (the initramfs it started from had it): until the
# reboot, no. Both bits, whatever else the mask has.
run = "v=$(cat /sys/module/amdgpu/parameters/dcdebugmask 2>/dev/null) && [ $(( v & 0x600 )) = $(( 0x600 )) ]"
