[plugin]
id = "hw-snapshots"
name = "System snapshots"
version = "0.1.0"
api = 1
description = "A btrfs snapshot of the system before and after every package change (an update, an install), the last ones kept; listed in the desktop's History"
categories = ["hardware"]

[hardware]
filesystem = ["btrfs"]

[packages]
pacman = ["snapper", "snap-pac"]

[settings]
# How many package changes' snapshots are kept (each one is a pair,
# before and after).
keep = { default = 10, min = 3, max = 50 }

# Snapper set up for / (once; a subvolume already mounted at /.snapshots,
# as archinstall makes, is put back in place after), told how many to keep,
# and /.snapshots kept root's (0750: old snapshots hold old setuid
# programs); the History panel reads the list hw-checkpoints keeps.
# Only while this file is there. Without D-Bus (snapper talks to its
# daemon otherwise): the same as root, and it works while installing too.
[[targets]]
template = "snapshots.conf.tmpl"
output = "/etc/tmpfiles.d/mazapan-snapshots.conf"
system = true
reload = "[ -e /etc/tmpfiles.d/mazapan-snapshots.conf ] || exit 0; if ! grep -qE '^SNAPPER_CONFIGS=.*[\" ]root[\" ]' /etc/conf.d/snapper 2>/dev/null; then if mountpoint -q /.snapshots; then umount /.snapshots && rmdir /.snapshots && snapper --no-dbus -c root create-config / && btrfs subvolume delete /.snapshots && mkdir /.snapshots && mount /.snapshots || exit 1; else snapper --no-dbus -c root create-config / || exit 1; fi; fi; snapper --no-dbus -c root set-config TIMELINE_CREATE=no NUMBER_CLEANUP=yes NUMBER_LIMIT={{ settings.keep * 2 }} NUMBER_LIMIT_IMPORTANT={{ settings.keep * 2 }} && chmod 0750 /.snapshots && systemctl enable --now snapper-cleanup.timer"

[[checks]]
name = "{{ t \"check.config\" }}"
run = "grep -qE '^SNAPPER_CONFIGS=.*[\" ]root[\" ]' /etc/conf.d/snapper"
