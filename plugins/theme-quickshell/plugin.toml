[plugin]
id = "theme-quickshell"
name = "Quickshell theme"
version = "0.1.0"
api = 1
description = "Theme tokens as a QML singleton (Theme.qml) for every shell widget"
categories = ["theme"]

[packages]
pacman = ["quickshell"]

[[targets]]
template = "Theme.qml.tmpl"
output = "~/.config/quickshell/mazapan/Theme.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

# The shell itself.
[coverage]
apps = ["org.quickshell"]
