[plugin]
id = "theme-quickshell"
name = "Quickshell theme"
version = "0.1.0"
api = 1
description = "Theme tokens as a QML singleton (Theme.qml) for every shell widget"

[packages]
pacman = ["quickshell"]

[[targets]]
template = "Theme.qml.tmpl"
output = "~/.config/quickshell/myarch/Theme.qml"
# Ask the running shell to reload; start it if it isn't running.
reload = '''qs ipc -c myarch call myarch reload >/dev/null 2>&1 || { qs kill -c myarch >/dev/null 2>&1; hyprctl dispatch 'hl.dsp.exec_cmd("qs -c myarch")' >/dev/null; }'''
