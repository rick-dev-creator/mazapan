[plugin]
id = "hw-apple-nvme-suspend"
name = "MacBook NVMe waking from sleep"
version = "0.1.0"
api = 1
description = "Keeps the NVMe drive of the 2015-2017 MacBook and MacBook Pro out of its deepest power state (D3cold), which it fails to wake from after sleep"
categories = ["hardware"]

[hardware]
product = ["MacBook8,1", "MacBook9,1", "MacBook10,1", "MacBookPro13,[123]", "MacBookPro14,[123]"]

# Apple's NVMe controller (S1X, S3X) never allowed into D3cold: a udev rule,
# at every start and for the drive there now; taken off, allowed again.
[[targets]]
template = "nvme.rules.tmpl"
output = "/etc/udev/rules.d/mazapan-apple-nvme-suspend.rules"
system = true
reload = "udevadm control --reload; on=1; [ -e /etc/udev/rules.d/mazapan-apple-nvme-suspend.rules ] && on=0; for d in /sys/bus/pci/devices/*; do [ \"$(cat $d/vendor)\" = 0x106b ] || continue; case $(cat $d/device) in 0x2001|0x2003) [ -w $d/d3cold_allowed ] && echo $on > $d/d3cold_allowed ;; esac; done; true"

[[checks]]
name = "{{ t \"check.d3cold\" }}"
run = "for d in /sys/bus/pci/devices/*; do [ \"$(cat $d/vendor)\" = 0x106b ] || continue; case $(cat $d/device) in 0x2001|0x2003) [ \"$(cat $d/d3cold_allowed 2>/dev/null)\" = 0 ] || exit 1 ;; esac; done"
