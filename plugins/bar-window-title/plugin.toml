[plugin]
id = "bar-window-title"
name = "Window title"
version = "0.1.0"
api = 1
description = "The focused window's title in the bar, next to the workspaces"
requires = ["shell-bar"]

[packages]
pacman = ["quickshell"]

[settings]
# Size of the title, in points.
font_size = 9.5
# Longest the title may get, logical pixels; longer ones end in "…".
max_width = 520

[[targets]]
template = "Title.qml.tmpl"
output = "~/.config/quickshell/myarch/widgets/left/20-title.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"
