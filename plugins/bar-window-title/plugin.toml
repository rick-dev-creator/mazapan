[plugin]
id = "bar-window-title"
name = "Window title"
version = "0.1.0"
api = 1
description = "The focused window's title in the bar, next to the workspaces"

[packages]
pacman = ["quickshell"]

[settings]
# Size of the title, in points.
font_size = 9.5
# Longest the title may get, logical pixels; longer ones end in "…".
max_width = 520

[[targets]]
template = "Title.qml.tmpl"
output = "~/.config/quickshell/myarch/widgets/left/20-title.qml"
# Ask the running shell to reload; start it if it isn't running.
reload = '''qs ipc -c myarch call myarch reload >/dev/null 2>&1 || { qs kill -c myarch >/dev/null 2>&1; hyprctl dispatch 'hl.dsp.exec_cmd("qs -c myarch")' >/dev/null; }'''
