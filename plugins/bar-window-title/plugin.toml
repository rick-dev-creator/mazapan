[plugin]
id = "bar-window-title"
name = "Window title"
version = "0.1.0"
api = 1
description = "The focused window's title in the bar, next to the workspaces"
categories = ["bar"]
requires = ["shell-bar"]

[packages]
pacman = ["quickshell"]

[settings]
# Size of the title, in points.
font_size = { default = 9.5, min = 6, max = 20, step = 0.5 }
# Longest the title may get, logical pixels; longer ones end in "…".
max_width = { default = 520, min = 100, max = 2000 }

[[targets]]
template = "Title.qml.tmpl"
output = "~/.config/quickshell/mazapan/widgets/left/20-title.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"
