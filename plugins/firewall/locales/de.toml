"plugin.description" = "Eine Firewall, wie der eine Schalter bei macOS: Nichts kommt herein, worum dieser Computer nicht gebeten hat, alles, worum er bittet, geht hinaus (ufw). Drucker und Geräte im Netzwerk werden weiterhin gefunden. Das Installationsprogramm schaltet sie ein"
