[plugin]
id = "shell-bar"
name = "Bar"
version = "0.2.0"
api = 1
description = "A bar on every monitor (Quickshell), filled with the widgets other plugins put in its left/center/right slots; ships a kit of components for them"
categories = ["bar"]
requires = ["theme-quickshell", "hypr-base"]

[packages]
pacman = ["quickshell"]

[settings]
# Bar height in logical pixels.
height = { default = 28, min = 20, max = 64 }

# How every plugin with Quickshell files reloads the shell (their reload
# command runs it), so it lives in one place.
[[targets]]
template = "shell-reload.sh.tmpl"
output = "~/.local/share/myarch/bin/shell-reload"

[[targets]]
template = "shell.qml.tmpl"
output = "~/.config/quickshell/myarch/shell.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"

[[targets]]
template = "shell.lua.tmpl"
output = "~/.config/hypr/myarch/shell.lua"
reload = "hyprctl reload >/dev/null"

# The kit: components every widget can use (import "../../components/kit").
[[targets]]
template = "KitBarPopup.qml.tmpl"
output = "~/.config/quickshell/myarch/components/kit/BarPopup.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"

[[targets]]
template = "KitBarItem.qml.tmpl"
output = "~/.config/quickshell/myarch/components/kit/BarItem.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"

[[targets]]
template = "KitGlyph.qml.tmpl"
output = "~/.config/quickshell/myarch/components/kit/Glyph.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"

[[targets]]
template = "KitLabel.qml.tmpl"
output = "~/.config/quickshell/myarch/components/kit/Label.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"

[[targets]]
template = "KitCaption.qml.tmpl"
output = "~/.config/quickshell/myarch/components/kit/Caption.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"

[[targets]]
template = "KitRule.qml.tmpl"
output = "~/.config/quickshell/myarch/components/kit/Rule.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"

[[targets]]
template = "KitToggle.qml.tmpl"
output = "~/.config/quickshell/myarch/components/kit/Toggle.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"

[[targets]]
template = "KitSlider.qml.tmpl"
output = "~/.config/quickshell/myarch/components/kit/Slider.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"

[[targets]]
template = "KitListRow.qml.tmpl"
output = "~/.config/quickshell/myarch/components/kit/ListRow.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"

[[targets]]
template = "KitButton.qml.tmpl"
output = "~/.config/quickshell/myarch/components/kit/Button.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"

[[targets]]
template = "KitTextField.qml.tmpl"
output = "~/.config/quickshell/myarch/components/kit/TextField.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"

# The bar runs on the Quickshell that is installed now and its config
# loaded. After an update the running bar is still the old binary (its
# executable shows as "deleted"): restart it on the new one first, so the
# check tests what you'll actually run. Inline rather than a generated
# script, so a rollback that removes generated files can't break it.
[[checks]]
name = "{{ t \"check.bar\" }}"
session = true
timeout = 25
run = '''
set -u
cfg=myarch

pid() { qs list -c "$cfg" 2>/dev/null | awk '/Process ID/ { print $3; exit }'; }
start() { hyprctl dispatch 'hl.dsp.exec_cmd("qs -c myarch --no-duplicate")' >/dev/null; }
answers() { qs ipc -c "$cfg" call myarch ping >/dev/null 2>&1; }

p=$(pid)
if [ -z "$p" ]; then
  echo "the bar wasn't running: starting it"
  start
elif readlink "/proc/$p/exe" | grep -q "(deleted)"; then
  echo "Quickshell was updated: restarting the bar on the new version"
  qs kill -c "$cfg" >/dev/null 2>&1
  for _ in $(seq 20); do [ -z "$(pid)" ] && break; sleep 0.25; done
  start
fi

for _ in $(seq 40); do answers && break; sleep 0.25; done
answers || { echo "the bar doesn't answer"; exit 1; }

sleep 1
if qs log -c "$cfg" 2>/dev/null | tail -n 30 | grep -q "Failed to load configuration"; then
  qs log -c "$cfg" | grep -A2 "Failed to load configuration" | tail -n 3
  exit 1
fi
'''
