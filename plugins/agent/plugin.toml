[plugin]
id = "agent"
name = "Agents"
version = "0.11.0"
api = 1
description = "Your coding agents: in the bar, which is working and which waits for you (a click goes to its window), each account's limits and when they reset, and what they've used today, for Claude Code, opencode, pi, Codex… every account found by itself; and from the palette, ask one about this desktop with mazapan's report"
categories = ["agent", "tools", "bar"]
requires = ["shell-bar", "hypr-base"]

[packages]
pacman = ["quickshell", "libnotify", "sqlite", "qt6-graphs", "jq", "libsecret", "wl-clipboard"]

[settings]
# The agent "Ask an agent about this desktop" opens. "claude": the Ask
# card, answered by the first coding agent there is (Claude Code with the
# first of your accounts that has room). Any other command opens that agent
# in a terminal with the report as its first message; any agent that takes
# a prompt as its argument works ("codex", "opencode run"…). To let it use mazapan directly (status, previews, apply,
# undo), register the MCP server with it, e.g.
#   claude mcp add --scope user mazapan -- mazapan mcp
command = "claude"
# Asks an agent about this desktop (the Ask card).
ask_key = "SUPER + SHIFT + A"
# Asks an agent about the selected text (else what was copied).
selection_key = "SUPER + SHIFT + S"
# Opens the agents: their sessions, limits and use.
panel_key = "SUPER + I"
# The mazapán in the Ask card: its gestures say what the agent is doing (listening, thinking, waiting for your approval…). Off: a glyph and words.
mascot = true
# Who answers in the Ask card: the first coding agent there is, or one of them. Only Claude Code can change things (through Mazapan, with your approval); the others only answer.
ask_agent = { default = "auto", choices = ["auto", "claude", "codex", "pi"] }
# Which Claude account answers: empty, the first with room in its limits; else its email, as "mazapan agents" lists it.
ask_account = ""
# What Claude is paid with: your subscription, or Anthropic's API key from the keyring (only for what you ask yourself, never about something from elsewhere).
ask_credential = { default = "subscription", choices = ["subscription", "anthropic"] }
# The model: the agent's own default, or one of Claude's.
ask_model = { default = "default", choices = ["default", "haiku", "sonnet", "opus"] }
# Claude Code tells which session works or waits through hooks this plugin
# puts in each configuration's settings.json (your own hooks stay; a copy
# of the file is kept the first time). Off: taken out again.
claude_hooks = true
# A notification when a session waits for you, or is done after working
# this many seconds (0: never).
notify_after = { default = 30, min = 0, max = 3600 }
# A notification when an account's limit passes this percentage (0: never).
limit_alert = { default = 80, min = 0, max = 100 }
# Claude Code's metrics (lines written and taken out, commits, pull
# requests, active time) to a receiver on this computer, for the dashboard:
# OpenTelemetry, metrics only (never a prompt), kept here. Your own
# telemetry setup, if there is one, is left as it is.
otel = true
# The receiver's port, on 127.0.0.1 only.
otel_port = { default = 47318, min = 1025, max = 65535 }
# An agent's change to this desktop (through mazapan's MCP server) waits for
# you: a card shows who asks and the exact diff, Allow or Don't allow. Off:
# allowed at once, as its own client already asked.
approve_changes = true
# The editor a project opens in from the palette, as its command, the
# folder after it ("code", "rider", "zed"…; "": none, only the agent).
editor = { default = "", kind = "command" }

[[targets]]
template = "qmldir.tmpl"
output = "~/.config/quickshell/mazapan/components/agents/qmldir"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "AgentsService.qml.tmpl"
output = "~/.config/quickshell/mazapan/components/agents/AgentsService.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

# The agent's face in the Ask card: the mazapán and its gestures.
[[targets]]
template = "Mazapan.qml.tmpl"
output = "~/.config/quickshell/mazapan/components/agents/Mazapan.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "Agents.qml.tmpl"
output = "~/.config/quickshell/mazapan/widgets/right/01-agents.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

# Its place in the Control Center (when that's on, the robot leaves the bar).
[[targets]]
template = "Now.qml.tmpl"
output = "~/.config/quickshell/mazapan/control/now/10-agents.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "Section.qml.tmpl"
output = "~/.config/quickshell/mazapan/control/sections/40-agents.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

# The dashboard: its own Quickshell process, beside the shell's files (the
# same theme and kit), opened by its launcher.
# The palette's "? question", and questions about a capture, the selected
# text or files: answered here.
[[targets]]
template = "Ask.qml.tmpl"
output = "~/.config/quickshell/mazapan/panels/ask.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

# An agent's change, yours to allow, with its diff.
[[targets]]
template = "Approve.qml.tmpl"
output = "~/.config/quickshell/mazapan/panels/approve.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

# The palette's recent projects: the editor and the agent's last conversation.
[[targets]]
template = "agent-open.sh.tmpl"
output = "~/.local/share/mazapan/bin/agent-open"

[[targets]]
template = "agent-ask.sh.tmpl"
output = "~/.local/share/mazapan/bin/agent-ask"

# Files (Nautilus): right click, Scripts, Ask an agent.
[[targets]]
template = "nautilus-ask.sh.tmpl"
output = "~/.local/share/nautilus/scripts/Ask an agent"
reload = "chmod +x ~/.local/share/nautilus/scripts/'Ask an agent' 2>/dev/null; true"

[[targets]]
template = "Dashboard.qml.tmpl"
output = "~/.config/quickshell/mazapan/agents-dashboard.qml"
# Open, it's reloaded (not open: nothing to do).
reload = "qs ipc --any-display -p ~/.config/quickshell/mazapan/agents-dashboard.qml call dashboard reload >/dev/null 2>&1 || true"

[[targets]]
template = "dashboard.sh.tmpl"
output = "~/.local/share/mazapan/bin/agents-dashboard"

# opencode tells its sessions' state through a plugin of its own.
[[targets]]
template = "opencode-sessions.js.tmpl"
output = "~/.config/opencode/plugin/mazapan-sessions.js"

# Claude Code's hooks: put in or taken out with the setting.
[[targets]]
template = "claude-hooks.sh.tmpl"
output = "~/.local/share/mazapan/bin/agent-claude-hooks"
# The plugin gone (the script with it): hooks and telemetry taken out of Claude's settings.
reload = "f=~/.local/share/mazapan/bin/agent-claude-hooks; if [ -e \"$f\" ]; then sh \"$f\"; else mazapan agents hooks remove; mazapan agents telemetry off; fi >/dev/null 2>&1; true"

# The receiver, through a socket: nothing runs until an agent sends.
[[targets]]
template = "otel.service.tmpl"
output = "~/.config/systemd/user/mazapan-agents-otel.service"

[[targets]]
template = "otel.socket.tmpl"
output = "~/.config/systemd/user/mazapan-agents-otel.socket"
# Off or gone: stopped first (a unit whose file has gone can still be
# stopped, not disabled), then its link taken out.
reload = "s=mazapan-agents-otel; d=~/.config/systemd/user; if [ -e $d/$s.socket ] && {{ if settings.otel }}true{{ else }}false{{ end }}; then systemctl --user daemon-reload; systemctl --user stop $s.service 2>/dev/null; systemctl --user enable -q $s.socket; systemctl --user restart $s.socket; else systemctl --user stop $s.socket $s.service 2>/dev/null; systemctl --user disable -q $s.socket 2>/dev/null; rm -f $d/sockets.target.wants/$s.socket; systemctl --user daemon-reload; fi; true"

# The palette's "API key" action: one provider's key into the keyring.
[[targets]]
template = "agent-keys.sh.tmpl"
output = "~/.local/share/mazapan/bin/agent-keys"

# Its keys: asking, and the agents' panel.
[[targets]]
template = "agent.lua.tmpl"
output = "~/.config/hypr/mazapan/agent.lua"
reload = "hyprctl reload >/dev/null"

[[actions]]
name = "{{ t \"ask\" }}"
# The Ask card about this desktop (mazapan's report with the question), to
# type it: the first coding agent answers it there (mazapan agents ask:
# Claude with the account that has room and Mazapan's read-only tools),
# copied or continued in a terminal. Another agent set as the command:
# that one, in a terminal, the report as its first message.
run = "{{ if settings.command == \"claude\" }}sh ~/.local/share/mazapan/bin/agent-ask --desktop{{ else }}xdg-terminal-exec {{ settings.command }} \"$(mazapan report --agent)\"{{ end }}"
key = "{{ settings.ask_key }}"
label = "{{ t \"ask.label\" }}"
keywords = "{{ t \"ask.kw\" }}"

[[actions]]
name = "{{ t \"act.ask_selection\" }}"
run = "sh ~/.local/share/mazapan/bin/agent-ask --selection"
key = "{{ settings.selection_key }}"
label = "{{ t \"act.ask_selection.label\" }}"
keywords = "{{ t \"act.ask_selection.kw\" }}"

[[actions]]
name = "{{ t \"act.trust_off\" }}"
run = "mazapan agents trust all off"
keywords = "{{ t \"act.trust_off.kw\" }}"

[[actions]]
name = "{{ t \"report\" }}"
run = "mazapan report | wl-copy"
keywords = "{{ t \"report.kw\" }}"

[[actions]]
name = "{{ t \"act.open\" }}"
run = "qs ipc -c mazapan call agents open"
key = "{{ settings.panel_key }}"
label = "{{ t \"act.open.label\" }}"
keywords = "{{ t \"act.open.kw\" }}"

[[actions]]
name = "{{ t \"act.keys\" }}"
run = "sh ~/.local/share/mazapan/bin/agent-keys"
terminal = true
keywords = "{{ t \"act.keys.kw\" }}"

[[actions]]
name = "{{ t \"act.dashboard\" }}"
run = "sh ~/.local/share/mazapan/bin/agents-dashboard"
keywords = "{{ t \"act.dashboard.kw\" }}"
glyph = "󰕮"

[[checks]]
name = "{{ t \"check.otel\" }}"
run = "{{ if settings.otel }}systemctl --user is-active -q mazapan-agents-otel.socket{{ else }}true{{ end }}"
