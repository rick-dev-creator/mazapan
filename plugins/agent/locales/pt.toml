"plugin.name" = "Agentes"
"plugin.description" = "Seus agentes de programação: na barra, qual trabalha e qual espera por você (um clique leva à janela), os limites de cada conta e quando reiniciam, e o que usaram hoje, para Claude Code, opencode, pi, Codex… cada conta encontrada sozinha; e na paleta, pergunte a um sobre este desktop com o relatório do Mazapan"
"setting.command" = "Comando"
"setting.command.help" = "O agente de \"Perguntar a um agente sobre este desktop\". \"claude\": o cartão de pergunta, respondido pelo primeiro agente de programação que houver (Claude Code com a primeira das suas contas que tiver margem). Outro comando abre esse agente num terminal com o relatório como primeira mensagem; serve qualquer agente que aceite um pedido como argumento (\"codex\", \"opencode run\"…). Para que use o Mazapan diretamente (estado, prévias, aplicar, desfazer), registre o servidor MCP nele, p. ex. claude mcp add --scope user mazapan -- mazapan mcp"
