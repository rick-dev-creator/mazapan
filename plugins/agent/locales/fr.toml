"setting.command.help" = "L'agent de « Interroger un agent sur ce bureau ». \"claude\" : la carte de question, à laquelle répond le premier agent de code présent (Claude Code avec le premier de vos comptes qui a de la marge). Une autre commande ouvre cet agent dans un terminal avec le rapport comme premier message ; tout agent qui prend une demande en argument convient (\"codex\", \"opencode run\"…). Pour qu'il utilise Mazapan directement (état, aperçus, appliquer, annuler), enregistrez le serveur MCP auprès de lui, p. ex. claude mcp add --scope user mazapan -- mazapan mcp"
