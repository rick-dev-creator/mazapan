"plugin.name" = "Agents"
"plugin.description" = "Vos agents de code : dans la barre, lequel travaille et lequel vous attend (un clic mène à sa fenêtre), les limites de chaque compte et leur réinitialisation, et ce qu'ils ont utilisé aujourd'hui, pour Claude Code, opencode, pi, Codex… chaque compte trouvé tout seul ; et depuis la palette, interrogez-en un sur ce bureau avec le rapport de Mazapán"
"setting.command" = "Commande"
"setting.command.help" = "L'agent à ouvrir, sous forme de commande : il reçoit le rapport comme premier message. \"claude\" est Claude Code ; tout agent qui accepte une consigne en argument fonctionne (\"codex\", \"opencode run\"…). Pour qu'il utilise Mazapán directement (état, aperçus, appliquer, annuler), enregistrez-y le serveur MCP, par ex. claude mcp add --scope user mazapan -- mazapan mcp"
