"plugin.name" = "Agents"
"plugin.description" = "Vos agents de code : dans la barre, lequel travaille et lequel vous attend (un clic mène à sa fenêtre), les limites de chaque compte et leur réinitialisation, et ce qu'ils ont utilisé aujourd'hui, pour Claude Code, opencode, pi, Codex… chaque compte trouvé tout seul ; et depuis la palette, interrogez-en un sur ce bureau avec le rapport de Mazapan"
