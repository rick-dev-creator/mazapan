"plugin.name" = "Agentes"
"plugin.description" = "Tus agentes de programación: en la barra, cuál trabaja y cuál te espera (un clic lleva a su ventana), los límites de cada cuenta y cuándo se reinician, y lo que han usado hoy, para Claude Code, opencode, pi, Codex… cada cuenta encontrada sola; y desde la paleta, pregúntale a uno sobre este escritorio con el informe de Mazapán"
"setting.command" = "Comando"
"setting.command.help" = "El agente que se abre, como comando: recibe el informe como primer mensaje. \"claude\" es Claude Code; sirve cualquier agente que acepte una petición como argumento (\"codex\", \"opencode run\"…). Para que use Mazapán directamente (estado, vistas previas, aplicar, deshacer), registra el servidor MCP con él, p. ej. claude mcp add --scope user mazapan -- mazapan mcp"

