"plugin.name" = "Agentes"
"plugin.description" = "Tus agentes de programación: en la barra, cuál trabaja y cuál te espera (un clic lleva a su ventana), los límites de cada cuenta y cuándo se reinician, y lo que han usado hoy, para Claude Code, opencode, pi, Codex… cada cuenta encontrada sola; y desde la paleta, pregúntale a uno sobre este escritorio con el informe de Mazapan"
"setting.command" = "Comando"
"setting.command.help" = "El agente de «Preguntar a un agente sobre este escritorio». \"claude\": la tarjeta de preguntar, respondida por el primer agente de programación que haya (Claude Code con la primera de tus cuentas que tenga margen). Otro comando abre ese agente en una terminal con el informe como primer mensaje; sirve cualquier agente que acepte una petición como argumento (\"codex\", \"opencode run\"…). Para que use Mazapan directamente (estado, vistas previas, aplicar, deshacer), registra el servidor MCP con él, p. ej. claude mcp add --scope user mazapan -- mazapan mcp"
"setting.ask_key" = "Preguntar a un agente"
"setting.ask_key.help" = "Abre la tarjeta para preguntarle sobre este escritorio."
