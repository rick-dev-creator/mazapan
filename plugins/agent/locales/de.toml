"plugin.name" = "Agenten"
"plugin.description" = "Deine Coding-Agenten: in der Leiste, welcher arbeitet und welcher auf dich wartet (ein Klick führt zu seinem Fenster), die Limits jedes Kontos und wann sie zurückgesetzt werden, und was sie heute verbraucht haben, für Claude Code, opencode, pi, Codex… jedes Konto von selbst gefunden; und aus der Palette einen zu diesem Desktop befragen, mit dem Bericht von Mazapán"
"setting.command" = "Befehl"
"setting.command.help" = "Der Agent, der geöffnet wird, als Befehl: Er bekommt den Bericht als erste Nachricht. \"claude\" ist Claude Code; jeder Agent, der eine Anfrage als Argument annimmt, funktioniert (\"codex\", \"opencode run\"…). Damit er Mazapán direkt nutzen kann (Status, Vorschauen, Anwenden, Rückgängig), registriere den MCP-Server bei ihm, z. B. claude mcp add --scope user mazapan -- mazapan mcp"

