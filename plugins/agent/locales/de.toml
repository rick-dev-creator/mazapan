"plugin.name" = "Agenten"
"plugin.description" = "Deine Coding-Agenten: in der Leiste, welcher arbeitet und welcher auf dich wartet (ein Klick führt zu seinem Fenster), die Limits jedes Kontos und wann sie zurückgesetzt werden, und was sie heute verbraucht haben, für Claude Code, opencode, pi, Codex… jedes Konto von selbst gefunden; und aus der Palette einen zu diesem Desktop befragen, mit dem Bericht von Mazapan"
"setting.command" = "Befehl"
"setting.command.help" = "Der Agent für „Einen Agenten zu diesem Desktop fragen\". \"claude\": die Frage-Karte, beantwortet vom ersten Coding-Agenten, den es gibt (Claude Code mit dem ersten deiner Konten, das noch Spielraum hat). Ein anderer Befehl öffnet diesen Agenten in einem Terminal, mit dem Bericht als erster Nachricht; jeder Agent, der eine Anfrage als Argument nimmt, geht (\"codex\", \"opencode run\"…). Damit er Mazapan direkt nutzt (Status, Vorschauen, Anwenden, Rückgängig), registriere den MCP-Server bei ihm, z. B. claude mcp add --scope user mazapan -- mazapan mcp"
"setting.ask_key" = "Einen Agenten fragen"
"setting.ask_key.help" = "Öffnet die Karte, um zu diesem Desktop zu fragen."
"setting.selection_key" = "Zur Auswahl fragen"
"setting.selection_key.help" = "Fragt einen Agenten zum markierten Text (sonst zum Kopierten)."
"setting.panel_key" = "Die Agenten öffnen"
"setting.panel_key.help" = "Ihre Sitzungen, Limits und Nutzung."

