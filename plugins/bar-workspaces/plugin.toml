[plugin]
id = "bar-workspaces"
name = "Workspaces"
version = "0.5.0"
api = 1
description = "Workspace numbers in the bar, with a live preview on hover whose windows can be dragged out, and an overview of every workspace at once (as Niri's)"
categories = ["bar"]
requires = ["shell-bar", "hypr-base"]

[packages]
pacman = ["quickshell"]

[settings]
# Workspaces 1..persistent are always shown, even when empty; any other
# workspace appears while it exists.
persistent = { default = 5, min = 1, max = 10 }
# Width of each number's cell, logical pixels.
cell = { default = 28, min = 16, max = 64 }
# Size of the numbers, in points.
font_size = { default = 9.5, min = 6, max = 20, step = 0.5 }

# Live preview of a workspace from its number. Its windows can be dragged
# out: dropped on the screen they come to the current workspace, dropped on
# another number they go there.
preview = true
# What opens it: "right-click" on a number, or "hover" over it.
trigger = { default = "right-click", choices = ["right-click", "hover"] }
# With "hover": how long to hover before it opens.
open_delay_ms = { default = 350, min = 0, max = 3000 }
# It grows this long after opening.
grow_delay_ms = { default = 200, min = 0, max = 3000 }
# Card width, small and grown, logical pixels.
preview_width = { default = 320, min = 160, max = 1280 }
# Card width grown, logical pixels.
preview_width_large = { default = 640, min = 320, max = 2560 }
# Narrowest shape of the card, width / height: it's always at least this
# landscape. A monitor wider than that (an ultrawide) keeps its own shape.
preview_aspect = { default = 1.6, min = 1.0, max = 3.0, step = 0.1 }

# Every workspace of the screen at once, with its windows live: click to
# go, drag a window onto another workspace.
overview_key = "SUPER + Tab"

[[targets]]
template = "Workspaces.qml.tmpl"
output = "~/.config/quickshell/mazapan/widgets/left/10-workspaces.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "Preview.qml.tmpl"
output = "~/.config/quickshell/mazapan/components/workspaces/Preview.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "Overview.qml.tmpl"
output = "~/.config/quickshell/mazapan/panels/overview.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "overview.lua.tmpl"
output = "~/.config/hypr/mazapan/overview.lua"
reload = "hyprctl reload >/dev/null"

[[actions]]
name = "{{ t \"overview\" }}"
run = "qs ipc -c mazapan call mazapan panel overview"
key = "{{ settings.overview_key }}"
keywords = "{{ t \"overview.kw\" }}"
