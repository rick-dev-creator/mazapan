"plugin.name" = "Áreas de trabalho"
"plugin.description" = "Os números das áreas de trabalho na barra, com uma prévia ao vivo ao passar o mouse, de onde dá para arrastar as janelas"
"setting.cell" = "Célula"
"setting.cell.help" = "Largura da célula de cada número, em pixels lógicos."
"setting.font_size" = "Tamanho da fonte"
"setting.font_size.help" = "Tamanho dos números, em pontos."
"setting.grow_delay_ms" = "Espera para ampliar (ms)"
"setting.grow_delay_ms.help" = "Amplia depois de aberta por este tempo."
"setting.open_delay_ms" = "Espera para abrir (ms)"
"setting.open_delay_ms.help" = "Com \"hover\": quanto tempo passar o mouse antes de abrir."
"setting.persistent" = "Persistentes"
"setting.persistent.help" = "As áreas 1..persistentes aparecem sempre, mesmo vazias; qualquer outra aparece enquanto existir."
"setting.preview" = "Prévia"
"setting.preview.help" = "Prévia ao vivo de uma área de trabalho a partir do seu número. As janelas podem ser arrastadas: soltas na tela, vêm para a área atual; soltas em outro número, vão para lá."
"setting.preview_aspect" = "Proporção da prévia"
"setting.preview_aspect.help" = "O formato mais estreito do cartão, largura / altura: sempre pelo menos assim de largo. Um monitor mais largo que isso (ultrawide) mantém o seu."
"setting.preview_width" = "Largura da prévia"
"setting.preview_width.help" = "Largura do cartão pequeno, em pixels lógicos."
"setting.preview_width_large" = "Largura da prévia ampliada"
"setting.preview_width_large.help" = "Largura do cartão ampliado, em pixels lógicos."
"setting.trigger" = "Como abre"
"setting.trigger.help" = "O que a abre: \"right-click\" (clique direito) em um número, ou \"hover\" (passar o mouse) sobre ele."

