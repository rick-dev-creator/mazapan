"plugin.name" = "Espacios de trabajo"
"plugin.description" = "Los números de los espacios de trabajo en la barra, con una vista previa al pasar el ratón de la que se pueden sacar ventanas arrastrándolas"
"setting.cell" = "Celda"
"setting.cell.help" = "Ancho de la celda de cada número, en píxeles lógicos."
"setting.font_size" = "Tamaño de letra"
"setting.font_size.help" = "Tamaño de los números, en puntos."
"setting.grow_delay_ms" = "Espera para agrandar (ms)"
"setting.grow_delay_ms.help" = "Crece este tiempo después de abrirse."
"setting.open_delay_ms" = "Espera para abrir (ms)"
"setting.open_delay_ms.help" = "Con \"hover\": cuánto hay que dejar el ratón encima antes de que se abra."
"setting.persistent" = "Persistentes"
"setting.persistent.help" = "Los espacios 1..persistentes se muestran siempre, aunque estén vacíos; cualquier otro aparece mientras existe."
"setting.preview" = "Vista previa"
"setting.preview.help" = "Vista previa en vivo de un espacio desde su número. Sus ventanas se pueden arrastrar: soltadas en la pantalla vienen al espacio actual, soltadas en otro número van allí."
"setting.preview_aspect" = "Proporción de la vista previa"
"setting.preview_aspect.help" = "La forma más estrecha de la tarjeta, ancho / alto: siempre al menos así de apaisada. Un monitor más ancho (ultrapanorámico) conserva la suya."
"setting.preview_width" = "Ancho de la vista previa"
"setting.preview_width.help" = "Ancho de la tarjeta pequeña, en píxeles lógicos."
"setting.preview_width_large" = "Ancho de la vista previa grande"
"setting.preview_width_large.help" = "Ancho de la tarjeta al crecer, en píxeles lógicos."
"setting.trigger" = "Cómo se abre"
"setting.trigger.help" = "Qué la abre: \"right-click\" (clic derecho) en un número, o \"hover\" (pasar el ratón) sobre él."

"preview.empty" = "workspace %1 · vacío"
"preview.one" = "workspace %1 · 1 ventana"
"preview.many" = "workspace %1 · %2 ventanas"
"preview.drop_to" = "→ workspace %1"
