"plugin.name" = "Arbeitsflächen"
"plugin.description" = "Die Nummern der Arbeitsflächen in der Leiste, mit einer Live-Vorschau beim Überfahren, aus der sich Fenster herausziehen lassen"
"setting.cell" = "Zelle"
"setting.cell.help" = "Breite der Zelle jeder Nummer, in logischen Pixeln."
"setting.font_size" = "Schriftgröße"
"setting.font_size.help" = "Größe der Nummern, in Punkt."
"setting.grow_delay_ms" = "Vergrößern nach (ms)"
"setting.grow_delay_ms.help" = "So lange nach dem Öffnen wird sie größer."
"setting.open_delay_ms" = "Öffnen nach (ms)"
"setting.open_delay_ms.help" = "Mit \"hover\": wie lange die Maus darauf bleiben muss, bis sie sich öffnet."
"setting.persistent" = "Dauerhaft"
"setting.persistent.help" = "Die Arbeitsflächen 1..persistent werden immer angezeigt, auch wenn sie leer sind; jede andere erscheint, solange es sie gibt."
"setting.preview" = "Vorschau"
"setting.preview.help" = "Live-Vorschau einer Arbeitsfläche über ihre Nummer. Ihre Fenster lassen sich herausziehen: Auf dem Bildschirm abgelegt, kommen sie auf die aktuelle Arbeitsfläche, auf einer anderen Nummer abgelegt, wandern sie dorthin."
"setting.preview_aspect" = "Seitenverhältnis der Vorschau"
"setting.preview_aspect.help" = "Die schmalste Form der Karte, Breite / Höhe: immer mindestens so breit. Ein breiterer Monitor (Ultrawide) behält seine eigene."
"setting.preview_width" = "Breite der Vorschau"
"setting.preview_width.help" = "Breite der kleinen Karte, in logischen Pixeln."
"setting.preview_width_large" = "Breite der großen Vorschau"
"setting.preview_width_large.help" = "Breite der vergrößerten Karte, in logischen Pixeln."
"setting.trigger" = "Öffnen per"
"setting.trigger.help" = "Was sie öffnet: \"right-click\" (Rechtsklick) auf eine Nummer oder \"hover\" (mit der Maus darüberfahren)."

"preview.empty" = "Arbeitsfläche %1 · leer"
"preview.one" = "Arbeitsfläche %1 · 1 Fenster"
"preview.many" = "Arbeitsfläche %1 · %2 Fenster"
