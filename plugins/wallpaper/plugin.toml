[plugin]
id = "wallpaper"
name = "Wallpaper"
version = "0.1.0"
api = 1
description = "The wallpaper, drawn from the theme (or the theme's image): it changes with it, previews included"

[packages]
pacman = ["quickshell"]

[settings]
# Faint CRT scanlines over the whole wallpaper (dark themes).
scanlines = true

[[targets]]
template = "Wallpaper.qml.tmpl"
output = "~/.config/quickshell/myarch/panels/wallpaper.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"
