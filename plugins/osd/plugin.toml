[plugin]
id = "osd"
name = "Media keys"
version = "0.2.0"
api = 1
description = "The volume, microphone, brightness and media keys, and what they did shown for a moment on screen"
categories = ["tools"]
requires = ["shell-bar", "hypr-base"]

[packages]
pacman = ["wireplumber", "brightnessctl"]

[settings]
# How much a volume key changes it, in percent.
volume_step = { default = 5, min = 1, max = 20 }
# The loudest the keys go: 1.0 = 100%; up to 1.5 to boost quiet sources.
max_volume = { default = 1.0, min = 1.0, max = 1.5, step = 0.05 }
# How much a brightness key changes it, in percent.
brightness_step = { default = 5, min = 1, max = 25 }
# Where it shows on the focused screen.
position = { default = "bottom", choices = ["bottom", "top", "center"] }
# Seconds it stays.
seconds = { default = 1.5, min = 0.5, max = 5, step = 0.5 }

# The brightness keys: the laptop's screen, and external ones over DDC.
[[targets]]
template = "brightness.sh.tmpl"
output = "~/.local/share/mazapan/bin/brightness"

[[targets]]
template = "Osd.qml.tmpl"
output = "~/.config/quickshell/mazapan/panels/osd.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "keys.lua.tmpl"
output = "~/.config/hypr/mazapan/media-keys.lua"
reload = "hyprctl reload >/dev/null"

# In the palette, with their keys.
[[actions]]
name = "{{ t \"act.up\" }}"
run = '''wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; v=$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | cut -d' ' -f2); awk -v v="$v" 'BEGIN { exit !(v + 0 < {{ num settings.max_volume }}) }' && wpctl set-volume -l {{ num settings.max_volume }} @DEFAULT_AUDIO_SINK@ {{ settings.volume_step }}%+'''
key = "XF86AudioRaiseVolume"
keywords = "{{ t \"act.volume.kw\" }}"

[[actions]]
name = "{{ t \"act.down\" }}"
run = "wpctl set-volume @DEFAULT_AUDIO_SINK@ {{ settings.volume_step }}%-"
key = "XF86AudioLowerVolume"
keywords = "{{ t \"act.volume.kw\" }}"

[[actions]]
name = "{{ t \"act.mute\" }}"
run = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
key = "XF86AudioMute"
keywords = "{{ t \"act.volume.kw\" }}"

[[actions]]
name = "{{ t \"act.mic\" }}"
run = "wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"
key = "XF86AudioMicMute"
keywords = "{{ t \"act.mic.kw\" }}"

[[actions]]
name = "{{ t \"act.play\" }}"
run = "qs ipc -c mazapan call osd playPause"
key = "XF86AudioPlay"
keywords = "{{ t \"act.play.kw\" }}"

# XF86AudioPause does what Play does: one action for both.
[[actions]]
name = "{{ t \"act.next\" }}"
run = "qs ipc -c mazapan call osd next"
key = "XF86AudioNext"
keywords = "{{ t \"act.play.kw\" }}"

[[actions]]
name = "{{ t \"act.previous\" }}"
run = "qs ipc -c mazapan call osd previous"
key = "XF86AudioPrev"
keywords = "{{ t \"act.play.kw\" }}"

[[actions]]
name = "{{ t \"act.brighter\" }}"
run = "sh ~/.local/share/mazapan/bin/brightness up {{ settings.brightness_step }}"
key = "XF86MonBrightnessUp"
keywords = "{{ t \"act.light.kw\" }}"

[[actions]]
name = "{{ t \"act.dimmer\" }}"
run = "sh ~/.local/share/mazapan/bin/brightness down {{ settings.brightness_step }}"
key = "XF86MonBrightnessDown"
keywords = "{{ t \"act.light.kw\" }}"
