[plugin]
id = "themes"
name = "Theme picker"
version = "0.1.0"
api = 1
description = "Pick a theme and an accent, previewed live on the desktop, with each theme's contrast checked"
categories = ["panel", "theme"]
requires = ["shell-bar", "hypr-base"]

[packages]
pacman = ["quickshell", "hyprland"]

[settings]
# Opens the theme picker.
key = "SUPER + SHIFT + T"

[[targets]]
template = "themes.lua.tmpl"
output = "~/.config/hypr/mazapan/themes.lua"
reload = "hyprctl reload >/dev/null"

[[targets]]
template = "Picker.qml.tmpl"
output = "~/.config/quickshell/mazapan/panels/themes.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[actions]]
name = "{{ t \"act.pick\" }}"
run = "qs ipc -c mazapan call mazapan panel themes"
# On the palette's first screen.
home = 4
glyph = "󰸌"
label = "{{ t \"home\" }}"
key = "{{ settings.key }}"
keywords = "{{ t \"act.pick.kw\" }}"

[[actions]]
name = "{{ t \"act.omarchy\" }}"
# The terminal stays until Enter: what was imported, and how to use one.
run = "mazapan themes import-omarchy; read -r _"
terminal = true
keywords = "{{ t \"act.omarchy.kw\" }}"

[[actions]]
name = "{{ t \"act.list\" }}"
run = "mazapan themes"
terminal = true
keywords = "{{ t \"act.list.kw\" }}"
