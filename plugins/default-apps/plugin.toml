[plugin]
id = "default-apps"
name = "Default apps"
version = "0.3.0"
api = 1
description = "What opens links, PDFs, pictures, videos, music, text, folders, mail, documents and archives, and the terminal: the first installed of the usual ones, unless you picked one; what you set in an app stays"
categories = ["tools"]
requires = ["hypr-base"]

[packages]
# xdg-terminal-exec: the terminal everything opens (SUPER + Enter, the
# palette, Apps…), the one in xdg-terminals.list.
pacman = ["xdg-utils", "jq", "glib2", "xdg-terminal-exec", "foot"]

[settings]
# Links and web pages: a desktop file's name ("firefox.desktop"); empty: the first installed.
browser = { default = "", kind = "text", label = "Web browser" }
# Folders: empty, the first installed file manager.
files = { default = "", kind = "text", label = "Files" }
# PDF documents.
pdf = { default = "", kind = "text", label = "PDF" }
# Pictures.
images = { default = "", kind = "text", label = "Pictures" }
# Videos.
video = { default = "", kind = "text", label = "Videos" }
# Music and other audio.
audio = { default = "", kind = "text", label = "Music" }
# Plain text.
text = { default = "", kind = "text", label = "Text" }
# Email links (mailto:).
email = { default = "", kind = "text", label = "Email" }
# The terminal (SUPER + Enter, and what opens one): empty, the first installed.
terminal = { default = "", kind = "text", label = "Terminal" }
# Goes to the browser's window when it's open, else opens it ("": none).
browser_key = { default = "SUPER + B", label = "Browser key" }
# The same for the files.
files_key = { default = "SUPER + E", label = "Files key" }

# Set on every apply, and after the Apps menu installs or removes one.
[[targets]]
template = "default-apps.sh.tmpl"
output = "~/.local/share/mazapan/bin/default-apps"
reload = "sh ~/.local/share/mazapan/bin/default-apps"

[[targets]]
template = "launch-or-focus.sh.tmpl"
output = "~/.local/share/mazapan/bin/launch-or-focus"

[[targets]]
template = "keys.lua.tmpl"
output = "~/.config/hypr/mazapan/default-apps.lua"
reload = "hyprctl reload >/dev/null"
