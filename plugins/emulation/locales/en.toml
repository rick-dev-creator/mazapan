"plugin.name" = "Emulation"
"plugin.description" = "Retro and console games, ready: ~/Games with a folder per console for your games and one for BIOS, RetroArch set up on them the first time, and emulators' windows never dimmed and drawn with the least delay"
"setting.games" = "Games folder"
"setting.games.help" = "Where your games and the consoles' BIOS go."
"act.games" = "Open my games folder"
"act.games.kw" = "roms games emulators retro bios"
"bios.readme" = "Your consoles' BIOS go here (copies from consoles you own: Mazapán\ndoesn't download them). RetroArch and the other emulators look here.\n\n  PlayStation (RetroArch, DuckStation)  scph5500.bin, scph5501.bin, scph5502.bin\n  PlayStation 2 (PCSX2)                 your PS2's BIOS (any name; PCSX2 asks for it)\n  PlayStation 3 (RPCS3)                 PS3UPDAT.PUP, Sony's own firmware (free from Sony)\n  Sega CD / Mega CD                     bios_CD_U.bin, bios_CD_E.bin, bios_CD_J.bin\n  Dreamcast (Flycast)                   dc/dc_boot.bin, dc/dc_flash.bin\n  Nintendo DS (melonDS)                 bios7.bin, bios9.bin, firmware.bin (optional)\n  Game Boy Advance                      gba_bios.bin (optional)\n  PC Engine CD                          syscard3.pce\n\nThe games: ~/Games/ROMs, a folder per console."
