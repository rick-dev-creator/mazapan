"plugin.name" = "Émulation"
"plugin.description" = "Les jeux rétro et de console, prêts : ~/Games avec un dossier par console pour vos jeux et un pour les BIOS, RetroArch réglé dessus la première fois, et les fenêtres des émulateurs jamais assombries et affichées avec le moins de délai"
"setting.games" = "Dossier des jeux"
"setting.games.help" = "Où vont vos jeux et les BIOS des consoles."
"act.games" = "Ouvrir mon dossier de jeux"
"act.games.kw" = "roms jeux émulateurs rétro bios"
"bios.readme" = "Les BIOS de vos consoles vont ici (des copies de consoles que vous avez :\nMazapán ne les télécharge pas). RetroArch et les autres émulateurs les y cherchent.\n\n  PlayStation (RetroArch, DuckStation)  scph5500.bin, scph5501.bin, scph5502.bin\n  PlayStation 2 (PCSX2)                 le BIOS de votre PS2 (n'importe quel nom ; PCSX2 le demande)\n  PlayStation 3 (RPCS3)                 PS3UPDAT.PUP, le firmware de Sony (gratuit sur son site)\n  Sega CD / Mega CD                     bios_CD_U.bin, bios_CD_E.bin, bios_CD_J.bin\n  Dreamcast (Flycast)                   dc/dc_boot.bin, dc/dc_flash.bin\n  Nintendo DS (melonDS)                 bios7.bin, bios9.bin, firmware.bin (facultatif)\n  Game Boy Advance                      gba_bios.bin (facultatif)\n  PC Engine CD                          syscard3.pce\n\nLes jeux : ~/Games/ROMs, un dossier par console."
