setting = true
keywords = "{{ t \"kw.apps\" }}"

[[actions]]
name = "{{ t \"p.region\" }}"
run = "qs ipc -c mazapan call mazapan open settings region"
glyph = "󰗊"
setting = true
keywords = "{{ t \"kw.region\" }}"

[[actions]]
name = "{{ t \"p.display\" }}"
run = "qs ipc -c mazapan call mazapan open settings display"
