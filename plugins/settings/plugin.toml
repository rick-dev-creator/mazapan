[plugin]
id = "settings"
name = "Settings"
version = "0.1.0"
api = 1
description = "The settings everyone needs, a page each: keyboard, touchpad and mouse, default apps, language and time zone, the screens and the look; every other one in the Plugins panel"
categories = ["panel", "tools"]
requires = ["shell-bar", "hypr-base", "default-apps"]

[packages]
pacman = ["quickshell", "xdg-utils"]

[settings]
# Opens Settings.
key = "SUPER + comma"

[[targets]]
template = "Settings.qml.tmpl"
output = "~/.config/quickshell/mazapan/panels/settings.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "settings.lua.tmpl"
output = "~/.config/hypr/mazapan/settings.lua"
reload = "hyprctl reload >/dev/null"

[[actions]]
name = "{{ t \"act.open\" }}"
run = "qs ipc -c mazapan call mazapan panel settings"
# On the palette's first screen.
home = 3
glyph = ""
key = "{{ settings.key }}"
keywords = "{{ t \"act.open.kw\" }}"

[[actions]]
name = "{{ t \"p.keyboard\" }}"
run = "qs ipc -c mazapan call mazapan open settings keyboard"
glyph = "󰌌"
setting = true
keywords = "{{ t \"kw.keyboard\" }}"

[[actions]]
name = "{{ t \"p.pointer\" }}"
run = "qs ipc -c mazapan call mazapan open settings pointer"
glyph = "󰍽"
setting = true
keywords = "{{ t \"kw.pointer\" }}"

[[actions]]
