"plugin.name" = "Protetor de tela"
"plugin.description" = "Depois de um tempo sem uso, cada tela mostra a hora sobre uma de sete cenas nas cores do tema (o mazapán quicando, um terminal dos anos 80, chuva de código, estrelas, o Jogo da Vida, canos, um brilho), em movimento para nada ficar marcado; uma tecla ou o mouse e some. Um vídeo ou uma chamada o mantêm longe"
"act.show" = "Protetor de tela agora"
"act.show.kw" = "protetor tela relógio ausente"
"setting.after" = "Depois de (minutos)"
"setting.after.help" = "Minutos sem uso até aparecer. O bloqueio vem depois, como diz Inatividade."
"setting.date" = "Mostrar a data"
"setting.date.help" = "A data sob a hora."
"setting.style" = "O que mostra"
"setting.style.help" = "\"mazapan\" (o mazapán quicando), \"crt\" (um terminal dos anos 80), \"rain\" (código caindo), \"stars\" (estrelas), \"life\" (o Jogo da Vida), \"pipes\" (canos), \"glow\" (as cores do tema flutuando) ou \"random\" (um diferente a cada vez)."
