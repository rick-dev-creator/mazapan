"plugin.name" = "Salvapantallas"
"plugin.description" = "Tras un rato sin uso, cada pantalla muestra la hora sobre una de siete escenas con los colores del tema (el mazapán rebotando, una terminal de los 80, lluvia de código, estrellas, el Juego de la vida, tuberías, un brillo), moviéndose para que nada se quede marcado; una tecla o el ratón y desaparece. Un vídeo o una llamada lo mantienen lejos"
"act.show" = "Salvapantallas ahora"
"act.show.kw" = "salvapantallas protector reloj ausente"
"setting.after" = "Tras (minutos)"
"setting.after.help" = "Minutos sin uso hasta que aparece. El bloqueo viene después, según Inactividad."
"setting.date" = "Mostrar la fecha"
"setting.date.help" = "La fecha bajo la hora."
"setting.style" = "Qué muestra"
"setting.style.help" = "\"mazapan\" (el mazapán rebotando), \"crt\" (una terminal de los 80), \"rain\" (código que cae), \"stars\" (estrellas), \"life\" (el Juego de la vida), \"pipes\" (tuberías), \"glow\" (los colores del tema flotando) o \"random\" (uno distinto cada vez)."
