"plugin.name" = "Économiseur d'écran"
"plugin.description" = "Après un moment sans utilisation, chaque écran affiche l'heure sur l'une de sept scènes aux couleurs du thème (le mazapán qui rebondit, un terminal des années 80, une pluie de code, des étoiles, le Jeu de la vie, des tuyaux, une lueur), en mouvement pour que rien ne marque l'écran ; une touche ou la souris et il disparaît. Une vidéo ou un appel le tiennent à l'écart"
"act.show" = "Économiseur d'écran maintenant"
"act.show.kw" = "économiseur écran horloge absent veille"
"setting.after" = "Après (minutes)"
"setting.after.help" = "Minutes sans utilisation avant qu'il apparaisse. Le verrouillage vient après, selon Inactivité."
"setting.date" = "Afficher la date"
"setting.date.help" = "La date sous l'heure."
"setting.style" = "Ce qu'il montre"
"setting.style.help" = "\"mazapan\" (le mazapán qui rebondit), \"crt\" (un terminal des années 80), \"rain\" (du code qui tombe), \"stars\" (des étoiles), \"life\" (le Jeu de la vie), \"pipes\" (des tuyaux), \"glow\" (les couleurs du thème qui flottent) ou \"random\" (un différent à chaque fois)."
"act.try.mazapan" = "Économiseur d'écran : le mazapán"
"act.try.crt" = "Économiseur d'écran : terminal des années 80"
"act.try.rain" = "Économiseur d'écran : pluie de code"
"act.try.stars" = "Économiseur d'écran : étoiles"
"act.try.life" = "Économiseur d'écran : Jeu de la vie"
"act.try.pipes" = "Économiseur d'écran : tuyaux"
"act.try.glow" = "Économiseur d'écran : lueur"
