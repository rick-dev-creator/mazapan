"plugin.name" = "Bildschirmschoner"
"plugin.description" = "Nach einer Weile ohne Nutzung zeigt jeder Bildschirm die Uhrzeit über einer von sieben Szenen in den Farben des Themas (das hüpfende Mazapan, ein 80er-Terminal, Code-Regen, Sterne, das Spiel des Lebens, Rohre, ein Leuchten), in Bewegung, damit nichts einbrennt; eine Taste oder die Maus und er ist weg. Ein Video oder ein Anruf hält ihn fern"
"act.show" = "Bildschirmschoner jetzt"
"act.show.kw" = "bildschirmschoner uhr abwesend"
"setting.after" = "Nach (Minuten)"
"setting.after.help" = "Minuten ohne Nutzung, bis er erscheint. Die Sperre kommt danach, wie Inaktivität sagt."
"setting.date" = "Datum anzeigen"
"setting.date.help" = "Das Datum unter der Uhrzeit."
"setting.style" = "Was er zeigt"
"setting.style.help" = "\"mazapan\" (das hüpfende Mazapan), \"crt\" (ein Terminal der 80er), \"rain\" (fallender Code), \"stars\" (Sterne), \"life\" (das Spiel des Lebens), \"pipes\" (Rohre), \"glow\" (die schwebenden Farben des Themas) oder \"random\" (jedes Mal ein anderer)."
"act.try.mazapan" = "Bildschirmschoner: das Mazapan"
"act.try.crt" = "Bildschirmschoner: 80er-Terminal"
"act.try.rain" = "Bildschirmschoner: Code-Regen"
"act.try.stars" = "Bildschirmschoner: Sterne"
"act.try.life" = "Bildschirmschoner: Spiel des Lebens"
"act.try.pipes" = "Bildschirmschoner: Rohre"
"act.try.glow" = "Bildschirmschoner: Leuchten"
