[plugin]
id = "theme-gtk"
name = "GTK theme"
version = "0.1.0"
api = 1
description = "GTK4/libadwaita and GTK3 (via adw-gtk3) colors, fonts and dark mode"

[packages]
pacman = ["adw-gtk-theme"]

[[targets]]
template = "gtk4.css.tmpl"
output = "~/.config/gtk-4.0/gtk.css"
reload = "{{template \"gsettings\" .}}"

[[targets]]
template = "gtk3.css.tmpl"
output = "~/.config/gtk-3.0/gtk.css"
reload = "{{template \"gsettings\" .}}"

[[targets]]
template = "gtk3-settings.ini.tmpl"
output = "~/.config/gtk-3.0/settings.ini"
reload = "{{template \"gsettings\" .}}"

# GTK 3 (adw-gtk3) and GTK 4 / libadwaita apps.
[coverage]
toolkits = ["gtk3", "gtk4"]
