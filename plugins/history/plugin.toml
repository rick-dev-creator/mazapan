[plugin]
id = "history"
name = "History"
version = "0.1.0"
api = 1
description = "What changed on the desktop, in words (a theme, a setting, a plugin on or off, an update), newest first, each with its own undo"
categories = ["panel", "tools"]
requires = ["shell-bar", "hypr-base"]

[packages]
pacman = ["quickshell"]

[settings]
# Opens the history.
key = "SUPER + ALT + H"

[[targets]]
template = "History.qml.tmpl"
output = "~/.config/quickshell/mazapan/panels/history.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "history.lua.tmpl"
output = "~/.config/hypr/mazapan/history.lua"
reload = "hyprctl reload >/dev/null"

[[actions]]
name = "{{ t \"act.open\" }}"
run = "qs ipc -c mazapan call mazapan panel history"
# On the palette's first screen.
home = 8
glyph = "󰋚"
key = "{{ settings.key }}"
keywords = "{{ t \"act.open.kw\" }}"
