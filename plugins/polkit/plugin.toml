[plugin]
id = "polkit"
name = "Password prompts"
version = "0.1.0"
api = 1
description = "The polkit agent: when an app needs rights it doesn't have (mount a disk, change the time), it asks for your password here, in the theme"
categories = ["tools"]
requires = ["shell-bar"]

[packages]
pacman = ["polkit", "quickshell"]

[[targets]]
template = "Agent.qml.tmpl"
output = "~/.config/quickshell/mazapan/panels/polkit.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

# Polkit takes one agent per session: another one there first (a polkit
# agent from GNOME, KDE, Hyprland's) keeps this one out, and it's the
# other that asks, out of the theme.
[[checks]]
name = "{{ t \"check.agent\" }}"
run = "test \"$(qs ipc -c mazapan call polkit registered 2>/dev/null)\" = true"
session = true
