[plugin]
id = "hw-apple-fnkeys"
name = "Function keys first on Apple keyboards"
version = "0.1.0"
api = 1
description = "F1–F12 as function keys, media keys with Fn, on keyboards the hid_apple driver runs: Apple's, and others in Mac mode (Keychron…)"
categories = ["hardware"]

[hardware]
modules = ["hid_apple"]

[settings]
# 2: function keys first; 1: media keys first; 3: the kernel's guess (its
# default); 0: no Fn key.
fnmode = { default = 2, choices = [0, 1, 2, 3] }

[[targets]]
template = "hid-apple.conf.tmpl"
output = "/etc/modprobe.d/mazapan-hid-apple.conf"
system = true
# Now, without a reboot: the loaded driver takes it too.
reload = "[ -w /sys/module/hid_apple/parameters/fnmode ] && echo {{ settings.fnmode }} > /sys/module/hid_apple/parameters/fnmode || true"
