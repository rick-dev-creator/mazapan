[plugin]
id = "window-titles"
name = "Window titles"
version = "0.1.0"
api = 1
description = "One key shows or hides a title bar on every window"
categories = ["window"]
requires = ["hypr-base"]

[packages]
pacman = ["hyprland"]

[settings]
# Shows or hides the title bar on every window.
key = "SUPER + T"
# Bar height in logical pixels.
height = { default = 20, min = 12, max = 48 }

[[targets]]
template = "titles.lua.tmpl"
output = "~/.config/hypr/mazapan/titles.lua"
reload = "hyprctl reload >/dev/null"

[[actions]]
name = "{{ t \"toggle\" }}"
run = "hyprctl eval 'mazapan_titles_toggle()'"
key = "{{ settings.key }}"
keywords = "{{ t \"toggle.kw\" }}"
