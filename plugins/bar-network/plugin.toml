[plugin]
id = "bar-network"
name = "Network"
version = "0.1.0"
api = 1
description = "Network state in the bar; click for Wi-Fi (scan, join, forget) and wired connections"

# Quickshell talks to NetworkManager over D-Bus.
[packages]
pacman = ["quickshell", "networkmanager"]

[[targets]]
template = "Network.qml.tmpl"
output = "~/.config/quickshell/myarch/widgets/right/10-network.qml"
reload = "sh ~/.local/share/myarch/bin/shell-reload"

# NetworkManager runs and the machine is on some network.
[[checks]]
name = "{{t \"check\"}}"
run = "systemctl is-active -q NetworkManager && test \"$(nmcli -t networking connectivity)\" != none"
