[plugin]
id = "bar-network"
name = "Network"
version = "0.1.0"
api = 1
description = "Network state in the bar; click for Wi-Fi (scan, join, forget) and wired connections"

# Quickshell talks to NetworkManager over D-Bus.
[packages]
pacman = ["quickshell", "networkmanager"]

[[targets]]
template = "Network.qml.tmpl"
output = "~/.config/quickshell/myarch/widgets/right/10-network.qml"
# Ask the running shell to reload; start it if it isn't running.
reload = '''qs ipc -c myarch call myarch reload >/dev/null 2>&1 || { qs kill -c myarch >/dev/null 2>&1; hyprctl dispatch 'hl.dsp.exec_cmd("qs -c myarch")' >/dev/null; }'''
