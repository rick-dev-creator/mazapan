[plugin]
id = "bar-network"
name = "Network"
version = "0.1.0"
api = 1
description = "Network state in the bar; click for Wi-Fi (scan, join, forget) and wired connections"
categories = ["bar"]
requires = ["shell-bar"]

# Quickshell talks to NetworkManager over D-Bus.
[packages]
pacman = ["quickshell", "networkmanager", "qrencode", "curl"]

[[targets]]
template = "Network.qml.tmpl"
output = "~/.config/quickshell/mazapan/widgets/right/10-network.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

# Its place in the Control Center (when that's on, the widget leaves the bar).
[[targets]]
template = "Tile.qml.tmpl"
output = "~/.config/quickshell/mazapan/control/tiles/10-network.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

# NetworkManager runs and the machine is on some network.
[[checks]]
name = "{{ t \"check\" }}"
run = "systemctl is-active -q NetworkManager && test \"$(nmcli -t networking connectivity)\" != none"

[[actions]]
name = "{{ t \"act.wifi\" }}"
run = "if [ \"$(nmcli -t radio wifi)\" = enabled ]; then nmcli radio wifi off; else nmcli radio wifi on; fi"
glyph = "󰖩"
setting = true
keywords = "{{ t \"act.wifi.kw\" }}"
