[plugin]
id = "hypr-base"
name = "Hyprland base"
version = "0.2.0"
api = 1
description = "Hyprland entry point: monitors, input, core bindings; loads every plugin fragment in ~/.config/hypr/mazapan/"
categories = ["window"]

[packages]
pacman = ["hyprland", "foot"]

[settings]
# Keyboard layouts, comma separated ("us", "es", "us,es"): xkb's names.
kb_layout = { default = "us", kind = "text", label = "Keyboard layout" }
# Each layout's variant, in the same order ("intl", "" for none).
kb_variant = { default = "", kind = "text", label = "Keyboard variant" }
# xkb options: a key to switch layouts ("grp:alt_shift_toggle"; with
# several layouts and none, there's no way to switch), caps as control…
kb_options = { default = "", kind = "text", label = "Keyboard options" }
# Touchpad: a tap is a click (two fingers, the right one).
tap_to_click = { default = true, label = "Tap to click" }
# Touchpad: the content moves with the fingers, as on a phone.
natural_scroll = { default = false, label = "Natural scrolling" }
# Touchpad: off while typing, so the palm doesn't move the pointer.
disable_while_typing = { default = true, label = "Off while typing" }
# How fast the pointer moves, mouse and touchpad (-1 slowest, 0 as it comes, 1 fastest).
pointer_speed = { default = 0.0, min = -1.0, max = 1.0, label = "Pointer speed" }

[[targets]]
template = "hyprland.lua.tmpl"
output = "~/.config/hypr/hyprland.lua"
reload = "hyprctl reload >/dev/null"

# Hyprland (the installed binary) accepts the generated configuration. Runs
# without starting a compositor, so it's safe right after an update.
[[checks]]
name = "{{ t \"check.config\" }}"
run = "Hyprland --verify-config -c ~/.config/hypr/hyprland.lua"

# What the palette lists: each with its command and its keybinding.
[[actions]]
name = "{{ t \"act.terminal\" }}"
run = "foot"
key = "SUPER + Return"
keywords = "{{ t \"act.terminal.kw\" }}"

[[actions]]
name = "{{ t \"act.close\" }}"
run = "hyprctl dispatch 'hl.dsp.window.close()'"
key = "SUPER + Q"
keywords = "{{ t \"act.close.kw\" }}"

[[actions]]
name = "{{ t \"act.float\" }}"
run = "hyprctl dispatch 'hl.dsp.window.float({ action = \"toggle\" })'"
key = "SUPER + V"

[[actions]]
name = "{{ t \"act.split\" }}"
run = "hyprctl dispatch 'hl.dsp.layout(\"togglesplit\")'"
key = "SUPER + J"

[[actions]]
name = "{{ t \"act.exit\" }}"
run = "hyprctl dispatch 'hl.dsp.exit()'"
key = "SUPER + SHIFT + E"
keywords = "{{ t \"act.exit.kw\" }}"

[[actions]]
name = "{{ t \"act.focus\" }}"
key = "SUPER + ← ↑ → ↓"

[[actions]]
name = "{{ t \"act.workspace\" }}"
key = "SUPER + 1…0"

[[actions]]
name = "{{ t \"act.move\" }}"
key = "SUPER + SHIFT + 1…0"
