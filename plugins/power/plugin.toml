[plugin]
id = "power"
name = "Power"
version = "0.2.0"
api = 1
description = "Lock, suspend, log out, reboot and shut down: a button in the bar, the palette, and a lock screen in the theme"
categories = ["bar", "tools"]
requires = ["shell-bar", "hypr-base"]

[packages]
pacman = ["quickshell", "hyprlock"]

[settings]
# Locks the screen.
lock_key = "SUPER + L"
# The button in the middle of the bar, next to the clock.
bar = true

[[targets]]
template = "Power.qml.tmpl"
output = "~/.config/quickshell/mazapan/widgets/center/30-power.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

# Its place in the Control Center (when that's on, the button leaves the bar).
[[targets]]
template = "Section.qml.tmpl"
output = "~/.config/quickshell/mazapan/control/sections/99-power.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "hyprlock.conf.tmpl"
output = "~/.config/hypr/hyprlock.conf"

# The lock screen's line for a locked account, and its buttons.
[[targets]]
template = "lock-screen.sh.tmpl"
output = "~/.local/share/mazapan/bin/lock-screen"

[[targets]]
template = "power.lua.tmpl"
output = "~/.config/hypr/mazapan/power.lua"
reload = "hyprctl reload >/dev/null"

# The same commands the button runs (see Power.qml.tmpl).
[[actions]]
name = "{{ t \"lock\" }}"
run = "pidof hyprlock || hyprlock"
glyph = "󰌾"
key = "{{ settings.lock_key }}"
keywords = "{{ t \"lock.kw\" }}"

[[actions]]
name = "{{ t \"suspend\" }}"
run = "(pidof hyprlock || hyprlock &); sleep 1; systemctl suspend"
glyph = "󰒲"
keywords = "{{ t \"suspend.kw\" }}"

[[actions]]
name = "{{ t \"logout\" }}"
run = "hyprctl dispatch 'hl.dsp.exit()'"
glyph = "󰍃"
confirm = true
keywords = "{{ t \"logout.kw\" }}"

[[actions]]
name = "{{ t \"reboot\" }}"
run = "systemctl reboot"
glyph = "󰜉"
confirm = true
keywords = "{{ t \"reboot.kw\" }}"

[[actions]]
name = "{{ t \"poweroff\" }}"
run = "systemctl poweroff"
glyph = "󰐥"
confirm = true
keywords = "{{ t \"poweroff.kw\" }}"
