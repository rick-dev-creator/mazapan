[plugin]
id = "monitors"
name = "Monitors"
version = "0.1.0"
api = 1
description = "Monitor profiles matched by EDID, applied on their own when screens come and go; a visual manager to arrange them"
categories = ["panel", "tools"]
requires = ["shell-bar", "hypr-base"]

[packages]
pacman = ["hyprland", "quickshell"]

[settings]
# Opens the monitor manager.
key = "SUPER + SHIFT + M"
# When the connected screens match no profile, say how to arrange them.
notify_unknown = true
# An icon in the bar (right side) that opens the manager.
bar = true

# The engine: reads ~/.config/mazapan/monitors.json (your profiles; the
# manager writes it, you can too) and applies the one that matches.
[[targets]]
template = "monitors.lua.tmpl"
output = "~/.config/hypr/mazapan/monitors.lua"
reload = "hyprctl reload >/dev/null"

[[targets]]
template = "Manager.qml.tmpl"
output = "~/.config/quickshell/mazapan/panels/monitors.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[targets]]
template = "Widget.qml.tmpl"
output = "~/.config/quickshell/mazapan/widgets/right/05-monitors.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[actions]]
name = "{{ t \"open\" }}"
run = "qs ipc -c mazapan call mazapan panel monitors"
# On the palette's first screen.
home = 6
glyph = "󰍹"
label = "{{ t \"home\" }}"
key = "{{ settings.key }}"
keywords = "{{ t \"open.kw\" }}"
