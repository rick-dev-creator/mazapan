[plugin]
id = "theme-hyprland"
name = "Hyprland theme"
version = "0.1.0"
api = 1
description = "Borders, gaps, rounding, background and animations from the theme"
categories = ["theme"]
requires = ["hypr-base"]

[packages]
pacman = ["hyprland"]

[[targets]]
template = "theme.lua.tmpl"
output = "~/.config/hypr/myarch/theme.lua"
reload = "hyprctl reload >/dev/null"
