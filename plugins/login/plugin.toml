[plugin]
id = "login"
name = "Login screen"
version = "0.1.0"
api = 1
description = "The login screen in the theme: the clock, your name, your password (greetd, with a Hyprland of its own and a Quickshell greeter). The installer turns it on; on a system with another login manager, it takes its place"
categories = ["hardware"]

# For every machine, but it changes how the system starts: on only when asked.
[hardware]
any = true

[packages]
pacman = ["greetd", "hyprland", "quickshell", "gnome-keyring", "pam-fde-boot-pw"]

[settings]
# This account goes straight in when the computer starts, once each start:
# only for an encrypted disk whose password is this account's (it was just
# typed to unlock the disk, and it opens the keyring too). Off: the login
# screen, always.
autologin = false

# greetd started with mazapan's configuration (its own file stays as the
# package has it), and as the login manager from the next start. Taken off,
# greetd isn't started any more (the text login is back).
[[targets]]
template = "greetd.service.conf.tmpl"
output = "/etc/systemd/system/greetd.service.d/mazapan.conf"
system = true
reload = "systemctl daemon-reload; if [ -e /etc/systemd/system/greetd.service.d/mazapan.conf ]; then systemctl enable -f greetd.service; else systemctl disable greetd.service; fi"

# Its own PAM service (the system's stay as they are): the password also
# unlocks the keyring.
[[targets]]
template = "pam.tmpl"
output = "/etc/pam.d/mazapan-greetd"
system = true

[[targets]]
template = "greetd.toml.tmpl"
output = "/etc/greetd/mazapan.toml"
system = true

[[targets]]
template = "hyprland.lua.tmpl"
output = "/etc/greetd/mazapan-hyprland.lua"
system = true

# What a session is (greetd joins a command's words with spaces: a script
# keeps it whole).
[[targets]]
template = "session.sh.tmpl"
output = "/etc/greetd/mazapan-session.sh"
system = true

[[targets]]
template = "Greeter.qml.tmpl"
output = "/etc/greetd/mazapan-greeter.qml"
system = true
