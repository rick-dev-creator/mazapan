[plugin]
id = "hw-intel-wifi7-eht"
name = "Wi-Fi 6 on Intel BE200 and BE211 cards"
version = "0.1.0"
api = 1
description = "Turns Wi-Fi 7 off on Intel BE200 and BE211 cards (Dell XPS 14 and 16 on Panther Lake, and others): with it on, the driver's broken receive path drops the access point to its slowest rate and Wi-Fi is unusable; Wi-Fi 6 works at full speed"
categories = ["hardware"]

[hardware]
# BE200 (8086:272b) and BE211 (8086:e440): iwlwifi's EHT (802.11be) receive
# path is broken on them. Until Intel fixes it, Wi-Fi 6 (HE) instead.
pci = ["8086:e440", "8086:272b"]

[[targets]]
template = "iwlwifi.conf.tmpl"
output = "/etc/modprobe.d/mazapan-iwlwifi-eht.conf"
system = true
reboot = true

# The option is what modprobe will give iwlwifi: from the next start, or
# the next time the driver loads.
[[checks]]
name = "{{ t \"check.option\" }}"
run = "modprobe -c | grep -qx 'options iwlwifi disable_11be=Y'"
