"plugin.name" = "Colonnes"
"plugin.description" = "Fenêtres en colonnes sur une bande qui défile, comme dans Niri : chacune s'ouvre à droite à sa propre largeur, sans toucher aux autres ; ou de même largeur, largeur de téléphone, ou en mode focus. Espaces de travail les uns après les autres et gestes du pavé tactile"
"setting.auto" = "Automatique"
"setting.auto.help" = "Repartage l'écran chaque fois qu'une fenêtre s'ouvre, se ferme ou arrive. Désactivé (comme dans Niri) : une nouvelle fenêtre s'ouvre à droite à la largeur « width », les autres gardent la leur et la bande défile jusqu'à celle qui a le focus."
"setting.focus_key" = "Raccourci du mode focus"
"setting.focus_key.help" = "Mode focus : la fenêtre active va au milieu avec focus_ratio de la largeur, les autres s'empilent en une colonne de chaque côté. Sur une fenêtre latérale, il l'amène au milieu ; sur celle du milieu, il quitte le mode focus."
"setting.focus_ratio" = "Proportion du focus"
"setting.focus_ratio.help" = "La part de la largeur que prend la fenêtre du milieu en mode focus."
"setting.grow_key" = "Raccourci pour élargir"
"setting.grow_key.help" = "Élargit la colonne active de resize_step (une fraction de la largeur de l'écran). Maintenu, il se répète."
"setting.key" = "Raccourci"
"setting.key.help" = "Mode égal : toutes les colonnes de l'espace actif ont la même largeur et remplissent l'écran."
"setting.min_width" = "Largeur minimale"
"setting.min_width.help" = "La largeur minimale d'une colonne, en pixels logiques : le rétrécissement s'arrête là, et en mode égal, avec plus de fenêtres qu'il n'en tient à cette largeur, les colonnes la gardent et la rangée défile."
"setting.move_left_key" = "Raccourci pour déplacer à gauche"
"setting.move_left_key.help" = "Déplace la colonne active d'une place vers la gauche dans la rangée."
"setting.move_right_key" = "Raccourci pour déplacer à droite"
"setting.move_right_key.help" = "Déplace la colonne active d'une place vers la droite dans la rangée."
"setting.phone_aspect" = "Proportions du téléphone"
"setting.phone_aspect.help" = "Largeur / hauteur d'une colonne en mode téléphone ; 9:19.5 est un téléphone tenu droit. La hauteur est celle de l'écran, donc la largeur s'adapte à chaque écran."
"setting.phone_key" = "Raccourci du mode téléphone"
"setting.phone_key.help" = "Mode téléphone : chaque colonne prend la largeur d'un téléphone et le groupe est centré sur l'écran. Appuyer à nouveau revient au mode égal."
"setting.resize_step" = "Pas de redimensionnement"
"setting.resize_step.help" = "De combien les raccourcis élargissent ou rétrécissent une colonne, en fraction de la largeur de l'écran."
"setting.shrink_key" = "Raccourci pour rétrécir"
"setting.shrink_key.help" = "Rétrécit la colonne active de resize_step. Maintenu, il se répète."
"equal" = "Colonnes : même largeur pour toutes les fenêtres"
"phone" = "Colonnes : largeur de téléphone, centrées (encore : retour à égales)"
"focus" = "Colonnes : mode focus, cette fenêtre au milieu"
"grow" = "Colonnes : élargir celle-ci"
"shrink" = "Colonnes : rétrécir celle-ci"
"move_left" = "Colonnes : déplacer celle-ci à gauche"
"move_right" = "Colonnes : déplacer celle-ci à droite"
"equal.kw" = "colonnes largeur mosaïque organiser"
"phone.kw" = "colonnes mobile téléphone étroit centrer"
"focus.kw" = "colonnes centre zen concentration"
"grow.kw" = "élargir plus large taille redimensionner"
"shrink.kw" = "rétrécir plus étroit taille redimensionner"
"widths" = "Colonnes : largeur suivante (un tiers, la moitié, deux tiers, tout)"
"widths.kw" = "colonnes largeur taille niri"
"maximize" = "Colonnes : toute la largeur, et retour"
"maximize.kw" = "maximiser pleine largeur colonne niri"
"next_workspace" = "Espaces de travail : le suivant (un nouveau après le dernier)"
"workspace.kw" = "espace travail suivant nouveau vide niri"
"setting.width" = "Largeur d'une nouvelle fenêtre"
"setting.width.help" = "Quelle part de la largeur de l'écran une fenêtre prend en s'ouvrant."
"setting.widths_key" = "Touche des largeurs"
"setting.widths_key.help" = "La colonne active passe par un tiers, la moitié, deux tiers et toute la largeur (avec SHIFT, dans l'autre sens)."
"setting.maximize_key" = "Touche pour maximiser"
"setting.maximize_key.help" = "La colonne active prend toute la largeur ; à nouveau, elle revient comme avant."
"setting.fullscreen_key" = "Touche plein écran"
"setting.fullscreen_key.help" = "La fenêtre active en plein écran (et retour)."
"setting.consume_left_key" = "Touche pour joindre à gauche"
"setting.consume_left_key.help" = "La fenêtre active entre dans la colonne de gauche ; si elle partage sa colonne, elle en sort dans une colonne à elle."
"setting.consume_right_key" = "Touche pour joindre à droite"
"setting.consume_right_key.help" = "Pareil vers la droite."
"setting.next_workspace_key" = "Touche de l'espace suivant"
"setting.next_workspace_key.help" = "L'espace de travail suivant de cet écran ; après le dernier avec des fenêtres, un nouvel espace vide. Avec SHIFT, la fenêtre suit."
"setting.previous_workspace_key" = "Touche de l'espace précédent"
"setting.previous_workspace_key.help" = "L'espace de travail précédent de cet écran. Avec SHIFT, la fenêtre suit."
"setting.wheel" = "Molette de la souris"
"setting.wheel.help" = "SUPER et la molette font défiler la bande ; SUPER, SHIFT et la molette changent d'espace de travail."
"setting.gestures" = "Gestes du pavé tactile"
"setting.gestures.help" = "Trois doigts de côté font défiler la bande ; vers le haut et le bas, ils changent d'espace de travail."
