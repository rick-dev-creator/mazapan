"plugin.name" = "Columnas iguales"
"plugin.description" = "Ventanas en columnas: del mismo ancho, del ancho de un teléfono y centradas, o una disposición con la ventana activa en el centro"
"setting.auto" = "Automático"
"setting.auto.help" = "Vuelve a aplicar el modo del espacio cada vez que una ventana se abre, se cierra o llega, para que las columnas siempre compartan la pantalla. Desactívalo para conservar columnas que ajustaste a mano: entonces solo las teclas las reordenan."
"setting.focus_key" = "Tecla de foco"
"setting.focus_key.help" = "Modo foco: la ventana activa va al centro con focus_ratio del ancho, las demás se apilan en una columna a cada lado. En una ventana lateral la trae al centro; en la del centro sale del modo foco."
"setting.focus_ratio" = "Proporción del foco"
"setting.focus_ratio.help" = "Qué fracción del ancho ocupa la ventana del centro en modo foco."
"setting.grow_key" = "Tecla para ensanchar"
"setting.grow_key.help" = "Ensancha la columna activa en resize_step (una fracción del ancho de la pantalla). Mantenida, se repite."
"setting.key" = "Tecla"
"setting.key.help" = "Modo igual: todas las columnas del espacio activo tienen el mismo ancho y llenan la pantalla."
"setting.min_width" = "Ancho mínimo"
"setting.min_width.help" = "Lo más estrecha que puede ser una columna, en píxeles lógicos: al estrechar se para aquí, y en modo igual, con más ventanas de las que caben a este ancho, las columnas lo conservan y la fila se desplaza."
"setting.move_left_key" = "Tecla para mover a la izquierda"
"setting.move_left_key.help" = "Mueve la columna activa un lugar a la izquierda en la fila."
"setting.move_right_key" = "Tecla para mover a la derecha"
"setting.move_right_key.help" = "Mueve la columna activa un lugar a la derecha en la fila."
"setting.phone_aspect" = "Proporción de teléfono"
"setting.phone_aspect.help" = "Ancho / alto de una columna en modo teléfono; 9:19.5 es un teléfono en vertical. El alto es el del monitor, así que el ancho se adapta a cada pantalla."
"setting.phone_key" = "Tecla de teléfono"
"setting.phone_key.help" = "Modo teléfono: cada columna tiene el ancho de un teléfono y el grupo se centra en la pantalla. Pulsarla otra vez vuelve al modo igual."
"setting.resize_step" = "Paso de ajuste"
"setting.resize_step.help" = "Cuánto ensanchan o estrechan las teclas, como fracción del ancho de la pantalla."
"setting.shrink_key" = "Tecla para estrechar"
"setting.shrink_key.help" = "Estrecha la columna activa en resize_step. Mantenida, se repite."

"equal" = "Columnas: el mismo ancho para todas las ventanas"
