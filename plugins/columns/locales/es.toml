"plugin.name" = "Columnas"
"plugin.description" = "Ventanas en columnas sobre una tira que se desplaza, como en Niri: cada una se abre a la derecha con su propio ancho, sin tocar las demás; o del mismo ancho, de teléfono, o en modo foco. Espacios de trabajo uno tras otro y gestos del touchpad"
"setting.auto" = "Automático"
"setting.auto.help" = "Vuelve a repartir la pantalla cada vez que una ventana se abre, se cierra o llega. Desactivado (como en Niri): una ventana nueva se abre a la derecha con el ancho de «width», las demás conservan el suyo y la tira se desplaza hasta la que tiene el foco."
"setting.focus_key" = "Tecla de foco"
"setting.focus_key.help" = "Modo foco: la ventana activa va al centro con focus_ratio del ancho, las demás se apilan en una columna a cada lado. En una ventana lateral la trae al centro; en la del centro sale del modo foco."
"setting.focus_ratio" = "Proporción del foco"
"setting.focus_ratio.help" = "Qué fracción del ancho ocupa la ventana del centro en modo foco."
"setting.grow_key" = "Tecla para ensanchar"
"setting.grow_key.help" = "Ensancha la columna activa en resize_step (una fracción del ancho de la pantalla). Mantenida, se repite."
"setting.key" = "Tecla"
"setting.key.help" = "Modo igual: todas las columnas del espacio activo tienen el mismo ancho y llenan la pantalla."
"setting.min_width" = "Ancho mínimo"
"setting.min_width.help" = "Lo más estrecha que puede ser una columna, en píxeles lógicos: al estrechar se para aquí, y en modo igual, con más ventanas de las que caben a este ancho, las columnas lo conservan y la fila se desplaza."
"setting.move_left_key" = "Tecla para mover a la izquierda"
"setting.move_left_key.help" = "Mueve la columna activa un lugar a la izquierda en la fila."
"setting.move_right_key" = "Tecla para mover a la derecha"
"setting.move_right_key.help" = "Mueve la columna activa un lugar a la derecha en la fila."
"setting.phone_aspect" = "Proporción de teléfono"
"setting.phone_aspect.help" = "Ancho / alto de una columna en modo teléfono; 9:19.5 es un teléfono en vertical. El alto es el del monitor, así que el ancho se adapta a cada pantalla."
"setting.phone_key" = "Tecla de teléfono"
"setting.phone_key.help" = "Modo teléfono: cada columna tiene el ancho de un teléfono y el grupo se centra en la pantalla. Pulsarla otra vez vuelve al modo igual."
"setting.resize_step" = "Paso de ajuste"
"setting.resize_step.help" = "Cuánto ensanchan o estrechan las teclas, como fracción del ancho de la pantalla."
"setting.shrink_key" = "Tecla para estrechar"
"setting.shrink_key.help" = "Estrecha la columna activa en resize_step. Mantenida, se repite."
"setting.width" = "Ancho de una ventana nueva"
"setting.width.help" = "Qué parte del ancho de la pantalla ocupa una ventana al abrirse."
"setting.widths_key" = "Tecla de anchos"
"setting.widths_key.help" = "La columna activa pasa por un tercio, la mitad, dos tercios y todo el ancho (con SHIFT, al revés)."
"setting.maximize_key" = "Tecla para maximizar"
"setting.maximize_key.help" = "La columna activa ocupa todo el ancho; otra vez, vuelve a como estaba."
"setting.fullscreen_key" = "Tecla de pantalla completa"
"setting.fullscreen_key.help" = "La ventana activa a pantalla completa (y de vuelta)."
"setting.consume_left_key" = "Tecla para unir a la izquierda"
"setting.consume_left_key.help" = "La ventana activa entra en la columna de su izquierda; si comparte columna con otras, sale a una propia."
"setting.consume_right_key" = "Tecla para unir a la derecha"
"setting.consume_right_key.help" = "Lo mismo hacia la derecha."
"setting.next_workspace_key" = "Tecla del espacio siguiente"
"setting.next_workspace_key.help" = "El siguiente espacio de trabajo de esta pantalla; después del último con ventanas, uno nuevo vacío. Con SHIFT la ventana va también."
"setting.previous_workspace_key" = "Tecla del espacio anterior"
"setting.previous_workspace_key.help" = "El espacio de trabajo anterior de esta pantalla. Con SHIFT la ventana va también."
"setting.wheel" = "Rueda del ratón"
"setting.wheel.help" = "SUPER y la rueda desplazan la tira; SUPER, SHIFT y la rueda cambian de espacio de trabajo."
"setting.gestures" = "Gestos del touchpad"
"setting.gestures.help" = "Tres dedos de lado desplazan la tira; arriba y abajo cambian de espacio de trabajo."

