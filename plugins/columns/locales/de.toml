"plugin.name" = "Spalten"
"plugin.description" = "Fenster als Spalten auf einem Streifen, der scrollt, wie bei Niri: Jedes öffnet sich rechts in seiner eigenen Breite, die anderen bleiben; oder gleich breit, handybreit oder im Fokusmodus. Arbeitsflächen nacheinander und Touchpad-Gesten"
"setting.auto" = "Automatisch"
"setting.auto.help" = "Teilt den Bildschirm neu auf, wenn ein Fenster öffnet, schließt oder hinzukommt. Aus (wie bei Niri): Ein neues Fenster öffnet sich rechts in der Breite „width“, die anderen behalten ihre, und der Streifen scrollt zum fokussierten."
"setting.focus_key" = "Fokus-Taste"
"setting.focus_key.help" = "Fokusmodus: Das aktive Fenster kommt mit focus_ratio der Breite in die Mitte, die anderen stapeln sich in einer Spalte auf jeder Seite. Auf einem seitlichen Fenster holt die Taste es in die Mitte; auf dem mittleren beendet sie den Fokusmodus."
"setting.focus_ratio" = "Fokus-Anteil"
"setting.focus_ratio.help" = "Welchen Anteil der Breite das mittlere Fenster im Fokusmodus einnimmt."
"setting.grow_key" = "Taste zum Verbreitern"
"setting.grow_key.help" = "Verbreitert die aktive Spalte um resize_step (einen Bruchteil der Bildschirmbreite). Gedrückt gehalten, wiederholt sie sich."
"setting.key" = "Tastenkürzel"
"setting.key.help" = "Gleich-Modus: Alle Spalten der aktiven Arbeitsfläche werden gleich breit und füllen den Bildschirm."
"setting.min_width" = "Mindestbreite"
"setting.min_width.help" = "Wie schmal eine Spalte höchstens werden kann, in logischen Pixeln: Beim Verschmälern ist hier Schluss, und im Gleich-Modus behalten die Spalten diese Breite, wenn mehr Fenster da sind, als dabei passen, und die Reihe scrollt."
"setting.move_left_key" = "Taste: nach links"
"setting.move_left_key.help" = "Verschiebt die aktive Spalte in der Reihe um eine Stelle nach links."
"setting.move_right_key" = "Taste: nach rechts"
"setting.move_right_key.help" = "Verschiebt die aktive Spalte in der Reihe um eine Stelle nach rechts."
"setting.phone_aspect" = "Handy-Seitenverhältnis"
"setting.phone_aspect.help" = "Breite / Höhe einer Spalte im Handymodus; 9:19.5 ist ein hochkant gehaltenes Handy. Die Höhe ist die des Monitors, also passt sich die Breite jedem Bildschirm an."
"setting.phone_key" = "Handy-Taste"
"setting.phone_key.help" = "Handymodus: Jede Spalte bekommt die Breite eines Handys, und die Gruppe wird auf dem Bildschirm zentriert. Nochmal drücken wechselt zurück in den Gleich-Modus."
"setting.resize_step" = "Schrittweite"
"setting.resize_step.help" = "Wie viel die Tasten eine Spalte verbreitern oder verschmälern, als Bruchteil der Bildschirmbreite."
"setting.shrink_key" = "Taste zum Verschmälern"
"setting.shrink_key.help" = "Verschmälert die aktive Spalte um resize_step. Gedrückt gehalten, wiederholt sie sich."
"setting.width" = "Breite eines neuen Fensters"
"setting.width.help" = "Welcher Anteil der Bildschirmbreite ein Fenster beim Öffnen einnimmt."
"setting.widths_key" = "Taste für Breiten"
"setting.widths_key.help" = "Die aktive Spalte durchläuft ein Drittel, die Hälfte, zwei Drittel und die volle Breite (mit SHIFT umgekehrt)."
"setting.maximize_key" = "Taste zum Maximieren"
"setting.maximize_key.help" = "Die aktive Spalte nimmt die volle Breite ein; nochmals, zurück wie zuvor."
"setting.fullscreen_key" = "Taste für Vollbild"
"setting.fullscreen_key.help" = "Das aktive Fenster im Vollbild (und zurück)."
"setting.consume_left_key" = "Taste zum Anfügen links"
"setting.consume_left_key.help" = "Das aktive Fenster kommt in die Spalte links; teilt es seine Spalte mit anderen, bekommt es eine eigene."
"setting.consume_right_key" = "Taste zum Anfügen rechts"
"setting.consume_right_key.help" = "Dasselbe nach rechts."
"setting.next_workspace_key" = "Taste nächste Arbeitsfläche"
"setting.next_workspace_key.help" = "Die nächste Arbeitsfläche dieses Bildschirms; nach der letzten mit Fenstern eine neue, leere. Mit SHIFT kommt das Fenster mit."
"setting.previous_workspace_key" = "Taste vorige Arbeitsfläche"
"setting.previous_workspace_key.help" = "Die vorige Arbeitsfläche dieses Bildschirms. Mit SHIFT kommt das Fenster mit."
"setting.wheel" = "Mausrad"
"setting.wheel.help" = "SUPER und das Rad scrollen den Streifen; SUPER, SHIFT und das Rad wechseln die Arbeitsfläche."
"setting.gestures" = "Touchpad-Gesten"
"setting.gestures.help" = "Drei Finger seitwärts scrollen den Streifen; nach oben und unten wechseln die Arbeitsfläche."

