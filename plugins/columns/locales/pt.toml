"plugin.name" = "Colunas"
"plugin.description" = "Janelas em colunas numa faixa que rola, como no Niri: cada uma abre à direita com a sua largura, sem mexer nas outras; ou de mesma largura, de celular, ou em modo foco. Áreas de trabalho uma após a outra e gestos do touchpad"
"setting.auto" = "Automático"
"setting.auto.help" = "Divide a tela de novo sempre que uma janela abre, fecha ou chega. Desligado (como no Niri): uma janela nova abre à direita com a largura de «width», as outras mantêm a sua e a faixa rola até a que tem o foco."
"setting.focus_key" = "Tecla de foco"
"setting.focus_key.help" = "Modo foco: a janela ativa vai para o meio com focus_ratio da largura, as outras se empilham em uma coluna de cada lado. Numa janela lateral, traz ela para o meio; na do meio, sai do modo foco."
"setting.focus_ratio" = "Proporção do foco"
"setting.focus_ratio.help" = "A fração da largura que a janela do meio ocupa no modo foco."
"setting.grow_key" = "Tecla para alargar"
"setting.grow_key.help" = "Alarga a coluna ativa em resize_step (uma fração da largura da tela). Mantida pressionada, repete."
"setting.key" = "Tecla"
"setting.key.help" = "Modo igual: todas as colunas da área de trabalho ativa têm a mesma largura e preenchem a tela."
"setting.min_width" = "Largura mínima"
"setting.min_width.help" = "O mais estreita que uma coluna pode ficar, em pixels lógicos: ao estreitar, para aqui, e no modo igual, com mais janelas do que cabem nessa largura, as colunas a mantêm e a fileira rola."
"setting.move_left_key" = "Tecla para mover à esquerda"
"setting.move_left_key.help" = "Move a coluna ativa uma posição para a esquerda na fileira."
"setting.move_right_key" = "Tecla para mover à direita"
"setting.move_right_key.help" = "Move a coluna ativa uma posição para a direita na fileira."
"setting.phone_aspect" = "Proporção de celular"
"setting.phone_aspect.help" = "Largura / altura de uma coluna no modo celular; 9:19.5 é um celular na vertical. A altura é a do monitor, então a largura se adapta a cada tela."
"setting.phone_key" = "Tecla de celular"
"setting.phone_key.help" = "Modo celular: cada coluna tem a largura de um celular e o grupo fica centralizado na tela. Pressionar de novo volta ao modo igual."
"setting.resize_step" = "Passo de ajuste"
"setting.resize_step.help" = "Quanto as teclas alargam ou estreitam uma coluna, como fração da largura da tela."
"setting.shrink_key" = "Tecla para estreitar"
"setting.shrink_key.help" = "Estreita a coluna ativa em resize_step. Mantida pressionada, repete."
"setting.width" = "Largura de uma janela nova"
"setting.width.help" = "Que parte da largura da tela uma janela ocupa ao abrir."
"setting.widths_key" = "Tecla de larguras"
"setting.widths_key.help" = "A coluna ativa passa por um terço, metade, dois terços e toda a largura (com SHIFT, ao contrário)."
"setting.maximize_key" = "Tecla para maximizar"
"setting.maximize_key.help" = "A coluna ativa ocupa toda a largura; de novo, volta a como estava."
"setting.fullscreen_key" = "Tecla de tela cheia"
"setting.fullscreen_key.help" = "A janela ativa em tela cheia (e de volta)."
"setting.consume_left_key" = "Tecla para juntar à esquerda"
"setting.consume_left_key.help" = "A janela ativa entra na coluna à esquerda; se divide a coluna com outras, sai para uma própria."
"setting.consume_right_key" = "Tecla para juntar à direita"
"setting.consume_right_key.help" = "O mesmo para a direita."
"setting.next_workspace_key" = "Tecla da próxima área"
"setting.next_workspace_key.help" = "A próxima área de trabalho desta tela; depois da última com janelas, uma nova vazia. Com SHIFT a janela vai junto."
"setting.previous_workspace_key" = "Tecla da área anterior"
"setting.previous_workspace_key.help" = "A área de trabalho anterior desta tela. Com SHIFT a janela vai junto."
"setting.wheel" = "Roda do mouse"
"setting.wheel.help" = "SUPER e a roda rolam a faixa; SUPER, SHIFT e a roda trocam de área de trabalho."
"setting.gestures" = "Gestos do touchpad"
"setting.gestures.help" = "Três dedos para o lado rolam a faixa; para cima e para baixo trocam de área de trabalho."

