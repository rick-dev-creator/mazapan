"plugin.name" = "Colunas iguais"
"plugin.description" = "Janelas em colunas: da mesma largura, da largura de um celular e centralizadas, ou um layout com a janela ativa no meio"
"setting.auto" = "Automático"
"setting.auto.help" = "Reaplica o modo da área de trabalho sempre que uma janela abre, fecha ou chega, para que as colunas sempre dividam a tela. Desative para manter colunas que você ajustou à mão: aí só as teclas as reorganizam."
"setting.focus_key" = "Tecla de foco"
"setting.focus_key.help" = "Modo foco: a janela ativa vai para o meio com focus_ratio da largura, as outras se empilham em uma coluna de cada lado. Numa janela lateral, traz ela para o meio; na do meio, sai do modo foco."
"setting.focus_ratio" = "Proporção do foco"
"setting.focus_ratio.help" = "A fração da largura que a janela do meio ocupa no modo foco."
"setting.grow_key" = "Tecla para alargar"
"setting.grow_key.help" = "Alarga a coluna ativa em resize_step (uma fração da largura da tela). Mantida pressionada, repete."
"setting.key" = "Tecla"
"setting.key.help" = "Modo igual: todas as colunas da área de trabalho ativa têm a mesma largura e preenchem a tela."
"setting.min_width" = "Largura mínima"
"setting.min_width.help" = "O mais estreita que uma coluna pode ficar, em pixels lógicos: ao estreitar, para aqui, e no modo igual, com mais janelas do que cabem nessa largura, as colunas a mantêm e a fileira rola."
"setting.move_left_key" = "Tecla para mover à esquerda"
"setting.move_left_key.help" = "Move a coluna ativa uma posição para a esquerda na fileira."
"setting.move_right_key" = "Tecla para mover à direita"
"setting.move_right_key.help" = "Move a coluna ativa uma posição para a direita na fileira."
"setting.phone_aspect" = "Proporção de celular"
"setting.phone_aspect.help" = "Largura / altura de uma coluna no modo celular; 9:19.5 é um celular na vertical. A altura é a do monitor, então a largura se adapta a cada tela."
"setting.phone_key" = "Tecla de celular"
"setting.phone_key.help" = "Modo celular: cada coluna tem a largura de um celular e o grupo fica centralizado na tela. Pressionar de novo volta ao modo igual."
"setting.resize_step" = "Passo de ajuste"
"setting.resize_step.help" = "Quanto as teclas alargam ou estreitam uma coluna, como fração da largura da tela."
"setting.shrink_key" = "Tecla para estreitar"
"setting.shrink_key.help" = "Estreita a coluna ativa em resize_step. Mantida pressionada, repete."

"equal" = "Colunas: a mesma largura para todas as janelas"
"phone" = "Colunas: largura de celular, centralizadas (de novo: volta a iguais)"
"focus" = "Colunas: modo foco, esta janela no meio"
"grow" = "Colunas: alargar esta"
"shrink" = "Colunas: estreitar esta"
"move_left" = "Colunas: mover esta para a esquerda"
"move_right" = "Colunas: mover esta para a direita"
