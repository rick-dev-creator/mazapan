[plugin]
id = "columns"
name = "Columns"
version = "0.6.0"
api = 1
description = "Windows as columns on a strip that scrolls, as Niri does: each opens to the right at its own width, the others untouched; or equal widths, phone-width, a focus layout. Workspaces one after another, touchpad gestures"
categories = ["window"]
requires = ["hypr-base", "shell-bar"]

[packages]
pacman = ["hyprland"]

[settings]
# The keys are letters and arrows, on every keyboard without SHIFT or
# ALTGR: "=", "[" and "]" aren't, on Spanish or German ones, so a key with
# them couldn't be pressed there.

# Equal mode: every column of the focused workspace gets the same width,
# filling the screen.
key = "SUPER + W"
# Phone mode: every column gets a phone's width and the group is centered
# on the screen. Pressing it again goes back to equal mode.
phone_key = "SUPER + P"
# Width / height of a column in phone mode; 9:19.5 is a phone held upright.
# The height is the monitor's, so the width adapts to each screen.
phone_aspect = { default = 0.4615, min = 0.3, max = 0.8, step = 0.01 }
# Focus mode: the focused window goes to the middle at focus_ratio of the
# width, the others stack in a column on each side. On a side window it
# brings that one to the middle; on the middle one it leaves focus mode.
focus_key = "SUPER + C"
# The share of the width the middle window takes in focus mode.
focus_ratio = { default = 0.55, min = 0.3, max = 0.9, step = 0.05 }
# Grow / shrink the focused column by resize_step (a fraction of the screen
# width). Held down, they repeat.
grow_key = "SUPER + ALT + right"
# Shrink the focused column by resize_step. Held down, it repeats.
shrink_key = "SUPER + ALT + left"
# How much the keys grow or shrink a column, as a fraction of the screen width.
resize_step = { default = 0.05, min = 0.01, max = 0.25, step = 0.01 }
# Move the focused column one place left / right in the row.
move_left_key = "SUPER + SHIFT + left"
# Move the focused column one place right in the row.
move_right_key = "SUPER + SHIFT + right"
# Re-apply the workspace's mode whenever a window opens, closes or moves in,
# so the columns always share the screen. Off (as Niri): a window opens to
# the right at `width`, the others keep theirs, and the strip scrolls to
# show the one in focus; the keys rearrange them.
auto = false
# A new window's width, as a share of the screen.
width = { default = 0.5, min = 0.2, max = 1.0, step = 0.05 }
# The focused column's width: a third, a half, two thirds, all of it, in
# turn (with SHIFT, the other way round).
widths_key = "SUPER + R"
# The focused column all the screen's width; again, back to how it was.
maximize_key = "SUPER + F"
# The focused window fullscreen (and back).
fullscreen_key = "SUPER + SHIFT + F"
# The focused window into the column on its left / right, beside the one
# there; alone in a column, the same; in one with others, out into its own.
consume_left_key = "SUPER + CTRL + left"
# Into the column on its right (or out of its own, to the right).
consume_right_key = "SUPER + CTRL + right"
# The next / previous workspace on this screen; after the last one with
# windows, a new empty one. With SHIFT, the window goes along.
next_workspace_key = "SUPER + Page_Down"
# The previous workspace on this screen.
previous_workspace_key = "SUPER + Page_Up"
# The mouse: SUPER and the wheel scroll the strip; SUPER, SHIFT and the
# wheel change workspace.
wheel = true
# The touchpad: three fingers sideways scroll the strip, up and down
# change workspace.
gestures = true
# Narrowest a column may get, in logical pixels: shrinking stops here, and
# in equal mode, with more windows than fit at this width, columns keep it
# and the row scrolls.
min_width = { default = 400, min = 200, max = 1600 }

[[targets]]
template = "columns.lua.tmpl"
output = "~/.config/hypr/mazapan/columns.lua"
reload = "hyprctl reload >/dev/null"

# Where you are on the strip of columns, in the bar.
[[targets]]
template = "Strip.qml.tmpl"
output = "~/.config/quickshell/mazapan/widgets/left/20-strip.qml"
reload = "sh ~/.local/share/mazapan/bin/shell-reload"

[[actions]]
name = "{{ t \"equal\" }}"
run = "hyprctl eval 'mazapan_columns.equal()'"
key = "{{ settings.key }}"
keywords = "{{ t \"equal.kw\" }}"

[[actions]]
name = "{{ t \"phone\" }}"
run = "hyprctl eval 'mazapan_columns.phone()'"
key = "{{ settings.phone_key }}"
keywords = "{{ t \"phone.kw\" }}"

[[actions]]
name = "{{ t \"focus\" }}"
run = "hyprctl eval 'mazapan_columns.focus()'"
key = "{{ settings.focus_key }}"
keywords = "{{ t \"focus.kw\" }}"

[[actions]]
name = "{{ t \"grow\" }}"
run = "hyprctl eval 'mazapan_columns.grow()'"
key = "{{ settings.grow_key }}"
keywords = "{{ t \"grow.kw\" }}"

[[actions]]
name = "{{ t \"shrink\" }}"
run = "hyprctl eval 'mazapan_columns.shrink()'"
key = "{{ settings.shrink_key }}"
keywords = "{{ t \"shrink.kw\" }}"

[[actions]]
name = "{{ t \"widths\" }}"
run = "hyprctl dispatch 'hl.dsp.layout(\"colresize +conf\")'"
key = "{{ settings.widths_key }}"
keywords = "{{ t \"widths.kw\" }}"

[[actions]]
name = "{{ t \"maximize\" }}"
run = "hyprctl eval 'mazapan_columns.maximize()'"
key = "{{ settings.maximize_key }}"
keywords = "{{ t \"maximize.kw\" }}"

[[actions]]
name = "{{ t \"next_workspace\" }}"
run = "hyprctl dispatch 'hl.dsp.focus({ workspace = \"r+1\" })'"
key = "{{ settings.next_workspace_key }}"
keywords = "{{ t \"workspace.kw\" }}"

[[actions]]
name = "{{ t \"previous_workspace\" }}"
run = "hyprctl dispatch 'hl.dsp.focus({ workspace = \"r-1\" })'"
key = "{{ settings.previous_workspace_key }}"
keywords = "{{ t \"workspace.kw\" }}"

[[actions]]
name = "{{ t \"move_left\" }}"
run = "hyprctl dispatch 'hl.dsp.layout(\"swapcol l\")'"
key = "{{ settings.move_left_key }}"

[[actions]]
name = "{{ t \"move_right\" }}"
run = "hyprctl dispatch 'hl.dsp.layout(\"swapcol r\")'"
key = "{{ settings.move_right_key }}"
