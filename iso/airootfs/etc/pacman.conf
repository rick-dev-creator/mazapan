#
# The live system's pacman.conf: the ISO's own repository, and nothing
# else. An install takes every package from it (mazapan install), so it
# downloads nothing. The installed system gets Arch's usual one.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# No signature checks: it comes inside the ISO, checked as a whole (its
# checksum). Checking each would need the live keyring ready, which it may
# not be yet when an install starts.
[offline]
SigLevel = Never
Server = file:///var/cache/mazapan/offline
