source = "https://github.com/rick-dev-creator/mazapan-pomodoro"
ref = "v0.2.0"
commit = "cc221978e23e3c6ec40bc0883952da265e75bb41"
version = "0.2.0"
license = "MIT"
homepage = "https://github.com/rick-dev-creator/mazapan-pomodoro"
categories = ["panel", "bar", "tools"]
translations.de.name = "Pomodoro"
translations.de.description = "Konzentriert in Sitzungen mit Pausen dazwischen: ein Ring, der sich mit der Zeit füllt, die Sitzungen jedes Satzes, woran du arbeitest, Nicht stören beim Fokussieren, und der Fokus von heute und der Woche auf einen Blick"
translations.es.name = "Pomodoro"
translations.es.description = "Enfócate en sesiones con descansos entre ellas: un anillo que se llena con el tiempo, las sesiones de cada ciclo, en qué estás trabajando, No molestar mientras te enfocas, y el enfoque de hoy y de la semana de un vistazo"
translations.fr.name = "Pomodoro"
translations.fr.description = "Concentrez-vous par sessions, avec des pauses entre elles : un anneau qui se remplit avec le temps, les sessions de chaque cycle, ce sur quoi vous travaillez, Ne pas déranger pendant la concentration, et la concentration du jour et de la semaine en un coup d'œil"
translations.pt.name = "Pomodoro"
translations.pt.description = "Foque em sessões com pausas entre elas: um anel que se enche com o tempo, as sessões de cada ciclo, no que você está trabalhando, Não perturbe enquanto foca, e o foco de hoje e da semana num relance"

