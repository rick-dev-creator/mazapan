# mazapan's app catalog: what the Apps menu (and the installer's profiles)
# know how to install. Data, not code: to add one, add an entry and open a
# pull request.
#
# [[app]]
# id = "gimp"                    # lowercase letters, digits, dashes
# name = "GIMP"
# description = "One line on what it is"
# category = "graphics"          # see below
# pacman = ["gimp"]              # from Arch's official repositories, or…
# flatpak = "org.gimp.GIMP"      # …from Flathub (what the repositories don't have), or…
# webapp = "https://…"           # …a site as an app of its own (the webapps plugin), or…
# plugin = "markets"             # …a mazapan plugin (from a catalog), or…
# vendor = "jetbrains:RD"        # …from its maker, when neither of those can give it as it should be
#                                #   (jetbrains:RD Rider, vscode:stable VS Code, anthropic:claude-code
#                                #   Claude Code, which then keeps itself up to date): checked against the
#                                #   maker's SHA-256, in ~/.local/share/mazapan/vendor, updated by mazapan update
# desktop = "gimp.desktop"       # its launcher (to open it, and its icon)
# command = "lazygit"            # no launcher: the program a terminal runs to open it
# plugins = ["theme-gimp"]       # mazapan plugins that go with it: turned on with it
# translations.es.description = "Una línea sobre lo que es"
#
# Categories: internet, communication, office, development, agents,
# graphics, video, audio, games, utilities, finance.
#
# [[profile]] is a set of apps for a use ("Gaming"), offered as one card.
# No AUR: the repositories, Flathub or the web.
#
# Others can keep catalogs of their own, in this same form: config.toml's
#   app_catalogs = ["https://example.com/apps.toml"]
# adds them to the Apps menu (https, or a path; read again once a day). An
# id already here stays this one's, their profiles can use these apps, and
# only this catalog has the basic profile.

