# myarch's app catalog: what the Apps menu (and the installer's profiles)
# know how to install. Data, not code: to add one, add an entry and open a
# pull request.
#
# [[app]]
# id = "gimp"                    # lowercase letters, digits, dashes
# name = "GIMP"
# description = "One line on what it is"
# category = "graphics"          # see below
# pacman = ["gimp"]              # from Arch's official repositories, or…
# flatpak = "org.gimp.GIMP"      # …from Flathub (what the repositories don't have), or…
# webapp = "https://…"           # …a site as an app of its own (the webapps plugin), or…
# plugin = "markets"             # …a myarch plugin (from a catalog)
# desktop = "gimp.desktop"       # its launcher (to open it, and its icon)
# plugins = ["theme-gimp"]       # myarch plugins that go with it: turned on with it
# translations.es.description = "Una línea sobre lo que es"
#
# Categories: internet, communication, office, development, graphics,
# video, audio, games, utilities, finance.
#
# [[profile]] is a set of apps for a use ("Gaming"), offered as one card.
# No AUR: the repositories, Flathub or the web.

# --- profiles ---------------------------------------------------------------

[[profile]]
id = "basic"
name = "Basic"
description = "What every computer needs: a browser, files, pictures, documents, music and video"
glyph = 0xF02DC
basic = true
apps = ["chromium", "nautilus", "loupe", "papers", "celluloid", "text-editor", "file-roller", "calculator", "btop"]
translations.es.name = "Básico"
translations.es.description = "Lo que todo equipo necesita: navegador, archivos, fotos, documentos, música y video"

[[profile]]
id = "development"
name = "Development"
description = "Code editors, git, containers, languages and the command-line tools developers reach for"
glyph = 0xF0169
apps = ["vscode", "neovim", "git", "github-cli", "lazygit", "docker", "mise", "cli-tools", "zed"]
translations.es.name = "Desarrollo"
translations.es.description = "Editores de código, git, contenedores, lenguajes y las herramientas de terminal de todo desarrollador"

[[profile]]
id = "gaming"
name = "Gaming"
description = "Steam, other stores and launchers, and what makes games run better"
glyph = 0xF0297
apps = ["steam", "heroic", "lutris", "gamemode", "mangohud", "discord"]
translations.es.name = "Juegos"
translations.es.description = "Steam, otras tiendas y lanzadores, y lo que hace que los juegos vayan mejor"

[[profile]]
id = "creative"
name = "Creative"
description = "Photos, illustration, 3D and video editing"
glyph = 0xF03D8
apps = ["gimp", "inkscape", "krita", "darktable", "blender", "kdenlive"]
translations.es.name = "Creatividad"
translations.es.description = "Fotos, ilustración, 3D y edición de video"

[[profile]]
id = "office"
name = "Office"
description = "Documents, spreadsheets, mail and notes"
glyph = 0xF0219
apps = ["libreoffice", "thunderbird", "obsidian"]
translations.es.name = "Oficina"
translations.es.description = "Documentos, hojas de cálculo, correo y notas"

[[profile]]
