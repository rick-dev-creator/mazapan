# mazapan.dev: the site in site/ (Astro), built and put on GitHub Pages when
# main changes it, and every hour for the plugin registry (its catalog,
# mazapan.dev/plugins/index.toml, and the gallery come from it).
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "assets/mazapan.svg", ".github/workflows/site.yml"]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v6
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
