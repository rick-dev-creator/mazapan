name: Bug report
description: Something in Mazapan doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A security problem? Please don't open an issue: see [SECURITY.md](https://github.com/rick-dev-creator/mazapan/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it again
      placeholder: |
        1. Open the palette (SUPER + Space)
        2. …
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `mazapan version`
      placeholder: mazapan 0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it's installed
      options:
        - From the Mazapan ISO
        - On an existing Arch Linux
        - In a virtual machine
        - Other
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: For hardware problems, the output of `mazapan hardware`
      render: text
  - type: textarea
    id: report
    attributes:
      label: Report
      description: |
        The output of `mazapan report` (state, failing checks, recent errors). Read it before pasting: remove anything you'd rather not share.
      render: markdown
