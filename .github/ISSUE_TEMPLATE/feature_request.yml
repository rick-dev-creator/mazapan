name: Feature request
description: An idea to make Mazapan better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you'd like to do
      description: The need first, in your own words; then, if you have one, how you see it working.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agents
        - Desktop (bar, panels, palette, tiling)
        - Themes
        - Apps and profiles
        - Install and hardware
        - Updates and checkpoints
        - Plugins and the plugin API
        - Other
  - type: checkboxes
    id: plugin
    attributes:
      label: As a plugin
      options:
        - label: This could be a plugin of its own (see docs/plugin-api.md), and I might write it
