# Phosphor: an 80s terminal crossed with JetBrains Darcula, with Obsidian's
# purple as the accent.
#
# Colors are semantic first. Plugins ask for "accent" or "danger", never for
# "orange"; the [ansi] table exists only for terminals and TUIs.
# Contrast against bg (WCAG): every text color >= 4.5:1 except fg_subtle
# (3.0:1), for non-essential hints only, and accent (3.3:1), which is for
# fills and borders (>= 3:1); text in the accent color uses accent_text.

[meta]
name = "Phosphor"
mode = "dark"
description = "Warm charcoal CRT, Obsidian purple accent, Darcula syntax colors, square corners."
# Other accents to pick from (the theme picker); its own comes first.
accents = ["#d99a2b", "#4fa35f", "#3f7fd9", "#2a9d8f", "#d6557a"]

[colors]
bg             = "#1a1917"  # windows, editor, terminal: the CRT glass
bg_alt         = "#141311"  # bars, sidebars, header bars: one step darker
surface        = "#232220"  # cards, inputs, list rows
surface_raised = "#2d2b28"  # popovers, menus, dialogs
border         = "#3b3833"  # separators, inactive window borders

fg        = "#dcd3bf"  # body text: warm phosphor white
fg_muted  = "#9a917e"  # secondary text
fg_subtle = "#6c6558"  # hints, placeholders, disabled

accent      = "#7847eb"  # Obsidian's hue, darker: hsl(258 80% 60%). Focus, fills, cursor
accent_fg   = "#ffffff"  # text on top of accent (5.4:1)
accent_text = "#a68af9"  # accent as text on bg: links, URLs (Obsidian's dark accent-1)
accent_deep = "#21143d"  # near-black purple for large fills (active title bar); text on it: accent_text
selection   = "#39285d"  # selected text background: accent at 33% over bg

success = "#98b760"
warning = "#cc7832"  # Darcula keyword orange
danger  = "#e0584a"
info    = "#6897bb"  # Darcula number blue

[ansi]
black   = "#1a1917"
red     = "#d9574a"
green   = "#98b760"
yellow  = "#ffc66d"  # Darcula function yellow
blue    = "#6897bb"
magenta = "#9876aa"  # Darcula field purple
cyan    = "#5fa8a0"
white   = "#dcd3bf"

bright_black   = "#6b6457"
bright_red     = "#ff7a6b"
bright_green   = "#bfe08a"
bright_yellow  = "#ffd98f"
bright_blue    = "#8fb8dc"
bright_magenta = "#b99acb"
bright_cyan    = "#86cbc2"
bright_white   = "#f4ecd8"

[font]
mono = "JetBrainsMono Nerd Font"
ui   = "JetBrainsMono Nerd Font"
size = 11

[shape]
radius  = 0  # terminals don't have rounded corners
border  = 2
gap_in  = 4
gap_out = 8

[effects]
# Terminals let the wallpaper through, blurred.
terminal_opacity = 0.85
blur             = true
# Drawn from the theme's colors: a faint grid in the accent over a gradient.
# "plain" for bg_alt alone, or a path to an image (next to this file).
wallpaper        = "grid"

[motion]
enabled     = true
# Fades and color changes: short, motion informs, it doesn't decorate.
duration_ms = 180
curve       = [0.23, 1.0, 0.32, 1.0]  # cubic-bezier, ease-out quint
# Movement: a spring, like a tablet. Windows glide and settle instead of
# snapping; a hint of overshoot makes them feel physical without bouncing.
response_ms = 280
damping     = 0.86
